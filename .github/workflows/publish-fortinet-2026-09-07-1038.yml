name: Publish Fortinet 2026-09-07 10:38
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fortinet-2026-09-07-1038.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct exact validated ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,string
          p=Path('staging/fortinet-2026-09-07-10-38.b64.02')
          bad=p.read_text().strip()
          target='7286a0ee55c1c67b93ce6bc8763a2e126e07c780'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          assert len(bad)==11999, len(bad)
          found=None
          for pos in range(len(bad)+1):
              pre,bpost=bad[:pos],bad[pos:]
              for ch in alphabet:
                  s=pre+ch+bpost
                  raw=s.encode()
                  h=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
                  if h==target:
                      found=s; print('repaired chunk2 at',pos,'char',ch); break
              if found: break
          assert found is not None
          Path('/tmp/chunk2').write_text(found)
          PY
          cat \
            staging/fortinet-2026-09-07-10-38.correct.01 \
            /tmp/chunk2 \
            staging/fortinet-2026-09-07-10-38.b64.03 \
            staging/fortinet-2026-09-07-10-38.b64.04 \
            staging/fortinet-2026-09-07-10-38.correct.05 \
            staging/fortinet-2026-09-07-10-38.correct.06 \
            staging/fortinet-2026-09-07-10-38.correct.07 \
            staging/fortinet-2026-09-07-10-38.b64.08 \
            staging/fortinet-2026-09-07-10-38.b64.09 \
            | base64 -d > /tmp/fortinet-1038.zip
          echo '8eb4c4c4c3b24f35af8e5879c11d13e1d3f42687c00cf81418953b5504838ba7  /tmp/fortinet-1038.zip' | sha256sum -c -
          rm -rf /tmp/out && mkdir -p /tmp/out
          unzip -q /tmp/fortinet-1038.zip -d /tmp/out
          ROOT=/tmp/out/Fortinet_Daily_Study_Quiz_2026-09-07-10-38
          test -f "$ROOT/Fortinet_Daily_Study_Quiz_2026-09-07-10-38.html"
          test "$(find "$ROOT/images" -name '*.svg' | wc -l)" -eq 12
          test "$(find "$ROOT/images" -name '*.drawio' | wc -l)" -eq 12
          python - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          root=Path('/tmp/out/Fortinet_Daily_Study_Quiz_2026-09-07-10-38')
          h=(root/'Fortinet_Daily_Study_Quiz_2026-09-07-10-38.html').read_text()
          assert h.count('class="lesson"')==12
          assert h.count('class="question"')==50
          assert h.count('Check Answer</button>')==50
          assert h.count('class="feedback" id=')==50
          assert '<svg' not in h.lower() and 'data:image/svg' not in h.lower()
          for p in (root/'images').glob('*.svg'): ET.parse(p)
          for p in (root/'images').glob('*.drawio'):
              t=ET.parse(p); assert len(t.findall('.//mxCell'))>=8
          refs=re.findall(r'(?:src|href)="(images/[^"]+\.(?:svg|drawio))"',h)
          assert refs and all((root/r).exists() for r in refs)
          print('validated report and',len(refs),'diagram refs')
          PY
      - name: Publish docs and index
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/out/Fortinet_Daily_Study_Quiz_2026-09-07-10-38
          cp "$ROOT/Fortinet_Daily_Study_Quiz_2026-09-07-10-38.html" docs/
          mkdir -p docs/images
          cp "$ROOT"/images/* docs/images/
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html'); s=p.read_text(); r='Fortinet_Daily_Study_Quiz_2026-09-07-10-38.html'
          if r not in s:
              card='<section class="card latest"><span class="badge">LATEST — 2026-09-07 10:38</span><h2>2026-09-07 10:38 America/Los_Angeles</h2><p>12 Fortinet engineering lessons, 12 editable draw.io diagrams, 12 standalone SVGs, and 50 graded MCQs.</p><p><a class="btn" href="'+r+'">Open latest report</a></p><p><a href="https://ccaiccie4.github.io/Fortinet/'+r+'">GitHub Pages report</a></p></section>'
              pos=s.find('<section class="card latest">')
              if pos<0: pos=s.find('<section class="card">')
              s=s[:pos]+card+s[pos:]; p.write_text(s)
          PY
          git config user.name ccaiccie4
          git config user.email mikewissa2@gmail.com
          git add docs/Fortinet_Daily_Study_Quiz_2026-09-07-10-38.html docs/images docs/index.html
          git commit -m 'Publish Fortinet study report 2026-09-07 10:38'
          git push origin HEAD:main
