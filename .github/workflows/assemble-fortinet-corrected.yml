name: Publish corrected Fortinet static report
on:
  push:
    paths:
      - 'staging/fortinet-2026-09-04-16-41.READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate static report
        run: python scripts/build_corrected_fortinet.py
      - name: Commit corrected report
        run: |
          rm -f staging/fortinet-2026-09-04-16-41.prefix.html staging/fortinet-2026-09-04-16-41.READY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/Fortinet_Daily_Study_Quiz_2026-09-04-16-41.html docs/index.html staging || true
          git commit -m 'Publish corrected static Fortinet daily study 2026-09-04 16:41'
          git push
