name: Build Fortinet 2026-09-06 report
on:
  push:
    branches: [main]
    paths:
      - 'staging/generate_fortinet_2026_09_06.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct validate and publish report assets
        run: python staging/generate_fortinet_2026_09_06.py
      - name: Recheck generated report
        run: |
          test -f docs/Fortinet_Daily_Study_Quiz_2026-09-06-08-30.html
          test "$(find docs/images -maxdepth 1 -name '06-09-26-08-30-*.drawio' | wc -l)" -eq 12
          test "$(find docs/images -maxdepth 1 -name '06-09-26-08-30-*.svg' | wc -l)" -eq 12
      - name: Commit report assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Fortinet_Daily_Study_Quiz_2026-09-06-08-30.html docs/run-history.json docs/images/06-09-26-08-30-*.drawio docs/images/06-09-26-08-30-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Fortinet daily study report 2026-09-06 08:30'
            git push
          fi