ks + health</tspan><tspan x="552" dy="19">transport groups</tspan></text><rect x="678" y="82" width="184" height="112" rx="12" fill="#f4f7fb" stroke="#315a7d" stroke-width="2"/><text x="770" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18354f"><tspan x="770" dy="0">Path manager</tspan><tspan x="770" dy="19">eligible underlay</tspan><tspan x="770" dy="19">or placeholder</tspan></text><rect x="896" y="82" width="184" height="112" rx="12" fill="#f4f7fb" stroke="#315a7d" stroke-width="2"/><text x="988" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18354f"><tspan x="988" dy="0">Direct shortcut</tspan><tspan x="988" dy="19">IKE / IPsec</tspan><tspan x="988" dy="19">or hub fallback</tspan></text><text x="24" y="248" font-family="Arial,sans-serif" font-size="13" fill="#4b6174">Read left to right. Each stage proves only its own state; verify the next boundary independently.</text><text x="24" y="274" font-family="Arial,sans-serif" font-size="12" fill="#64798a">Fortinet Enterprise Networking &amp; Security · 2026-11-13 · sdwan-advpn2</text></svg>