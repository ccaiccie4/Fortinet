<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortinet Evidence Interpretation Test</title><style>body{margin:0;background:#08111c;color:#edf4ff;font:16px/1.65 system-ui}header,main{max-width:1080px;margin:auto;padding:22px}header{max-width:none;background:#741c1c}a{color:#8ccaff}code,pre{font-family:monospace}pre{background:#050b12;padding:10px;border-radius:7px;white-space:pre-wrap}.lesson,.q,.result{background:#111e2f;border:1px solid #344760;border-radius:9px;padding:16px;margin:14px 0}.ev{border-left:4px solid #d3a94d;padding-left:12px}.choice{display:block;background:#0b1725;border:1px solid #344760;padding:8px;margin:5px 0;border-radius:6px}button{background:#812525;color:#fff;border:0;border-radius:6px;padding:8px}.ok{border-color:#70df99!important}.bad{border-color:#ff8989!important}.rev{display:none}.checked .rev,.graded .rev{display:block}.result{display:none}.result.show{display:block}</style></head><body><header><h1>Fortinet Daily Study Quiz — Evidence + Interpretation TEST</h1><p>2026-08-30-21-25-EVIDENCE · every evidence excerpt answers what it proves, what it does not prove, and what comes next.</p></header><main><div id="lessons"></div><h1>50-question evidence-interpretation quiz</h1><button onclick="grade()">Submit / Grade</button> <button onclick="resetQ()">Reset</button><div id="result" class="result"></div><div id="quiz"></div><script>const T=[{n:'Secure SD-WAN',d:'FortiGate / Secure SD-WAN',u:'https://docs.fortinet.com/document/fortigate/7.6.7/administration-guide/818746/sd-wan-related-diagnose-commands',m:'The failure boundary is link → health check → SLA → SD-WAN rule → policy/session → application. An alive probe proves the probe path, not the application.',c:'diagnose sys sdwan health-check',o:'state(alive), packet-loss(0.000%) latency(0.110), jitter(0.024)',i:'The configured probe target is reachable through this member and the displayed metrics are currently healthy in Fortinet’s example.',x:'The application, firewall policy, NAT and actual selected member remain unproven.',next:'diagnose sys sdwan service4 → diagnose firewall proute list → application session/capture',extra:'If you instead see state(dead) with 100% loss, stay at the probe/underlay layer and prove interface, gateway, route and probe reachability before touching application policy.'},{n:'IPsec VPN',d:'FortiGate / IPsec VPN',u:'https://docs.fortinet.com/document/fortigate/7.6.6/administration-guide/44240/ipsec-related-diagnose-commands',m:'Tunnel Up proves an SA exists; it does not prove route, policy, selectors, NAT or return traffic. Directional counters tell you where to move next.',c:'diagnose vpn tunnel list name <tunnel>',o:'status=up ... stat: rxp=212 txp=0 rxb=16883 txb=0',i:'The SA is Up and has received traffic in Fortinet’s documented example. The directional counters show whether the SA is actually carrying packets.',x:'Protected routing, firewall policy and remote application acceptance remain unproven.',next:'Generate one controlled flow → watch rxp/txp/rxb/txb → route/policy → remote return path',extra:'If TX rises while RX stays flat in your own controlled test, stop rebuilding Phase 1. The failure boundary has moved to selectors, routing, firewall policy or the remote return path.'},{n:'FortiGate HA',d:'FortiGate / High Availability',u:'https://docs.fortinet.com/document/fortigate/7.6.6/administration-guide/63913/check-ha-synchronization-status',m:'HA troubleshooting is membership → election → config sync → service continuity. Do not force failover onto a standby whose configuration integrity is already suspect.',c:'get system ha status',o:'HA Health Status: OK ... Configuration Status: ... in-sync',i:'The cluster reports healthy and the shown configuration state is synchronized. Fortinet also documents matching checksums as synchronization evidence.',x:'Heartbeat redundancy and stateful application survival are not proven.',next:'Read roles/checksums → heartbeat/monitored links → controlled application failover test',extra:'If the member is out-of-sync, troubleshoot the checksum/configuration divergence before forcing failover. A green HA health line alone is not the whole HA story.'},{n:'NPU offload',d:'FortiGate / Hardware Acceleration',u:'https://community.fortinet.com/fortigate-3/troubleshooting-tip-session-offloaded-hardware-acceleration-95587',m:'An empty CPU debug may mean the established flow is being forwarded in hardware. The observation point matters.',c:'diagnose system session list',o:'flag=0x81/0x81, offload=4/4',i:'Fortinet’s example indicates offload in forward and reverse directions. Interpret the pair directionally rather than treating 4 as a universal NP value.',x:'Application health and live NPU packet counters are not proven.',next:'Correlate with hardware-session diagnostics; disable offload only narrowly if CPU trace is essential',extra:'No debug-flow output is not proof of no traffic when the session is accelerated. First prove where the session is being forwarded.'},{n:'FortiSwitch MCLAG',d:'FortiSwitch / FortiLink',u:'https://docs.fortinet.com/document/fortiswitch/7.6.0/fortilink-guide/173284/replacing-a-managed-fortiswitch-unit',m:'MCLAG means peer/ICL state plus downstream LACP/VLAN/STP. Unicast success can still hide multicast-specific failures.',c:'diagnose switch mclag icl',o:'icl-ports 27-28 ... peer-serial-number ... keepalive interval 1',i:'The ICL has the shown member ports and peer identity; keepalive fields provide peer-state evidence in Fortinet’s example.',x:'Downstream LACP, VLAN/STP and IGMP listener state are not proven.',next:'diagnose switch trunk summary MCLAG-ICL → downstream LACP/VLAN → IGMP if multicast-only',extra:'Fortinet’s same workflow shows up(2/2) for the ICL trunk summary. That proves both ICL members are Up in that example, not that the server or multicast path is correct.'},{n:'FortiManager validation',d:'FortiManager',u:'https://docs.fortinet.com/document/fortimanager/7.6.6/administration-guide/153046/installing-policy-packages-and-device-settings',m:'FortiManager intent, validation, install success and FortiGate runtime behavior are separate states.',c:'Device Manager > Install Wizard validation',o:'Devices with validation errors are skipped for installation.',i:'A validation-error target did not receive the install. Do not troubleshoot that FortiGate as if a partial new package is already running.',x:'The eventual policy logic and application behavior remain unproven.',next:'Open progress report → fix mapping/interface/object error → revalidate → install → FortiGate runtime test',extra:'Install Preview and Policy Package Diff are pre-execution evidence. Neither proves the device accepted the change or that a production flow will behave correctly.'}];const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));document.getElementById('lessons').innerHTML='<h1>Lessons</h1>'+T.map((t,i)=>`<article class="lesson"><h2>${i+1}. ${esc(t.n)}</h2><p>${esc(t.m)}</p><div class="ev"><h3>Evidence example</h3><p><code>${esc(t.c)}</code></p><pre>${esc(t.o)}</pre><p><b>What I infer:</b> ${esc(t.i)}</p><p><b>What I cannot infer:</b> ${esc(t.x)}</p><p><b>Next check:</b> ${esc(t.next)}</p></div><p>${esc(t.extra)}</p><p><b>Exact Fortinet source:</b> <a target="_blank" href="${t.u}">${t.u}</a></p></article>`).join('');const P=[['What is the strongest inference from the evidence?','i'],['What is still unproven?','x'],['What is the correct next branch?','next'],['Which troubleshooting principle best applies?','principle'],['Why is using the documented evidence example important?','source']];let Q=[];for(let i=0;i<50;i++){let ti=i%T.length,p=P[i%P.length],correct=p[1]=='principle'?'Prove the earliest failed layer, then move downstream only when that layer is healthy':p[1]=='source'?'The field/state interpretation is traceable to Fortinet documentation':T[ti][p[1]],choices=[correct,'Clear all state and restart first','A healthy upstream state proves the whole application','Change several layers at the same time'];let r=(i*3+1)%4;[choices[0],choices[r]]=[choices[r],choices[0]];Q.push(['Q'+String(i+1).padStart(2,'0'),ti,p[0],choices,r])}document.getElementById('quiz').innerHTML=Q.map(q=>`<section class="q" id="${q[0]}"><small>${q[0]} · ${esc(T[q[1]].d)}</small><h3>${q[2]}</h3>${q[3].map((x,i)=>`<label class="choice" data-i="${i}"><input type="radio" name="${q[0]}" value="${i}"> <b>${'ABCD'[i]}</b> ${esc(x)}</label>`).join('')}<button onclick="check('${q[0]}')">Check Answer</button><div class="fb"></div><div class="rev"><p><b>What you missed:</b> Separate the observed state from the inference, what remains unproven, and the next evidence branch.</p></div></section>`).join('');function s(id){let x=document.querySelector('input[name="'+id+'"]:checked');return x?+x.value:null}function paint(q,fin=false){let c=document.getElementById(q[0]),v=s(q[0]);c.querySelectorAll('.choice').forEach(x=>x.classList.remove('ok','bad'));c.querySelector('.choice[data-i="'+q[4]+'"]').classList.add('ok');if(v!==null&&v!==q[4])c.querySelector('.choice[data-i="'+v+'"]').classList.add('bad');c.querySelector('.fb').textContent=v===null?'Unanswered':v===q[4]?'Correct':'Incorrect';c.classList.add(fin?'graded':'checked');return v===q[4]}function check(id){paint(Q.find(q=>q[0]===id))}function grade(){let g=0,a=0;Q.forEach(q=>{if(s(q[0])!==null)a++;if(paint(q,true))g++});let p=g*2,r=document.getElementById('result');r.className='result show';r.innerHTML='<h2>'+p+'% — '+(p>=80?'PASS':'FAIL')+'</h2><p>'+g+'/50 correct · '+a+' answered · '+(50-a)+' unanswered.</p>'}function resetQ(){document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(c=>{c.classList.remove('checked','graded');c.querySelector('.fb').textContent='';c.querySelectorAll('.choice').forEach(x=>x.classList.remove('ok','bad'))});document.getElementById('result').className='result'}</script><script id="study-history" type="application/json">{"timestamp":"2026-08-30-21-25-EVIDENCE","evidence_output_interpretation":true,"question_count":50,"pass_threshold":80}</script></main></body></html>
