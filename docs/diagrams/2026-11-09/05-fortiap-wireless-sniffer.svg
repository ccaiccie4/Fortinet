<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="FortiAP/Wireless Radio-local wireless packet capture"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b4e7"/></marker></defs><rect width="1200" height="520" rx="20" fill="#071522"/><text x="40" y="38" font-size="24" font-weight="700" fill="#ffffff">FortiAP/Wireless — Radio-local wireless packet capture</text><text x="40" y="62" font-size="13" fill="#9fb8d0">Mechanism and evidence flow · November 9, 2026</text><path d="M 360 145 L 440 145" fill="none" stroke="#78b4e7" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="135" text-anchor="middle" font-size="14" fill="#d9eaff">configure radio</text><path d="M 760 145 L 840 145" fill="none" stroke="#78b4e7" stroke-width="3" marker-end="url(#arr)"/><text x="800" y="135" text-anchor="middle" font-size="14" fill="#d9eaff">select frames</text><path d="M 1000 210 C 1000 265, 200 275, 200 330" fill="none" stroke="#78b4e7" stroke-width="3" marker-end="url(#arr)"/><text x="600" y="260" text-anchor="middle" font-size="14" fill="#d9eaff">capture</text><path d="M 360 395 L 440 395" fill="none" stroke="#78b4e7" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="385" text-anchor="middle" font-size="14" fill="#d9eaff">stream</text><path d="M 760 395 L 840 395" fill="none" stroke="#78b4e7" stroke-width="3" marker-end="url(#arr)"/><text x="800" y="385" text-anchor="middle" font-size="14" fill="#d9eaff">save and inspect</text><g><rect x="40" y="80" width="320" height="130" rx="16" fill="#10253b" stroke="#78b4e7" stroke-width="2"/><circle cx="64" cy="104" r="13" fill="#285f91"/><text x="64" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="58" y="135" font-size="19" font-weight="700" fill="#ffffff">WTP profile</text><text x="58" y="162" font-size="15" fill="#c8d9e8"><tspan x="58" dy="0">Select AP radio</tspan><tspan x="58" dy="22">Sniffer mode</tspan></text></g><g><rect x="440" y="80" width="320" height="130" rx="16" fill="#10253b" stroke="#78b4e7" stroke-width="2"/><circle cx="464" cy="104" r="13" fill="#285f91"/><text x="464" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="458" y="135" font-size="19" font-weight="700" fill="#ffffff">Channel and width</text><text x="458" y="162" font-size="15" fill="#c8d9e8"><tspan x="458" dy="0">One RF channel</tspan><tspan x="458" dy="22">Band/radio capability</tspan></text></g><g><rect x="840" y="80" width="320" height="130" rx="16" fill="#10253b" stroke="#78b4e7" stroke-width="2"/><circle cx="864" cy="104" r="13" fill="#285f91"/><text x="864" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="858" y="135" font-size="19" font-weight="700" fill="#ffffff">Frame filters</text><text x="858" y="162" font-size="15" fill="#c8d9e8"><tspan x="858" dy="0">Station MAC / type</tspan><tspan x="858" dy="22">Avoid over-filtering</tspan></text></g><g><rect x="40" y="330" width="320" height="130" rx="16" fill="#10253b" stroke="#78b4e7" stroke-width="2"/><circle cx="64" cy="354" r="13" fill="#285f91"/><text x="64" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text><text x="58" y="385" font-size="19" font-weight="700" fill="#ffffff">Radio capture</text><text x="58" y="412" font-size="15" fill="#c8d9e8"><tspan x="58" dy="0">802.11 mgmt/control/data</tspan><tspan x="58" dy="22">One AP capture session</tspan></text></g><g><rect x="440" y="330" width="320" height="130" rx="16" fill="#10253b" stroke="#78b4e7" stroke-width="2"/><circle cx="464" cy="354" r="13" fill="#285f91"/><text x="464" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text><text x="458" y="385" font-size="19" font-weight="700" fill="#ffffff">Browser stream</text><text x="458" y="412" font-size="15" fill="#c8d9e8"><tspan x="458" dy="0">Live capture t