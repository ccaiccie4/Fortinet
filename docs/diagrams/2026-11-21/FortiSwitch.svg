<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="t d"><title id="t">FortiSwitch signed configuration backup verification</title><desc id="d">Technical flow diagram for FortiSwitch</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker></defs><rect width="1120" height="390" fill="#fff"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#101828">FortiSwitch signed configuration backup verification</text><path d="M214 178 L240 178" fill="none" stroke="#344054" stroke-width="2.5" marker-end="url(#a)"/><path d="M428 178 L454 178" fill="none" stroke="#344054" stroke-width="2.5" marker-end="url(#a)"/><path d="M642 178 L668 178" fill="none" stroke="#344054" stroke-width="2.5" marker-end="url(#a)"/><path d="M856 178 L882 178" fill="none" stroke="#344054" stroke-width="2.5" marker-end="url(#a)"/><rect x="34" y="122" width="180" height="112" rx="12" fill="#eaf2ff" stroke="#475467" stroke-width="1.5"/><text x="124" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">FortiSwitch A</text><text x="124" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">creates backup</text><rect x="248" y="122" width="180" height="112" rx="12" fill="#eaf7f0" stroke="#475467" stroke-width="1.5"/><text x="338" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">Device signature</text><text x="338" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">provenance + integrity</text><rect x="462" y="122" width="180" height="112" rx="12" fill="#fff4e5" stroke="#475467" stroke-width="1.5"/><text x="552" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">Backup file</text><text x="552" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">protected copy</text><rect x="676" y="122" width="180" height="112" rx="12" fill="#f2edff" stroke="#475467" stroke-width="1.5"/><text x="766" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">Restore on same</text><text x="766" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">FortiSwitch A</text><rect x="890" y="122" width="180" height="112" rx="12" fill="#fceef1" stroke="#475467" stroke-width="1.5"/><text x="980" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">Verification result</text><text x="980" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#101828">accept / warn / reject</text><rect x="34" y="278" width="1050" height="72" rx="10" fill="#f9fafb" stroke="#98a2b3"/><text x="54" y="307" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#344054">Operational boundary</text><text x="54" y="331" font-family="Arial,sans-serif" font-size="14" fill="#344054">Foreign-device or modified file is unverified; log mode accepts with warning, reject mode blocks restore</text></svg>