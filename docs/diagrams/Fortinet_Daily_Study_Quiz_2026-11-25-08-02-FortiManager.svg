<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><title>FortiManager platform integrity chain</title><desc>Power-on validates UEFI and TPM trust, then runtime hashes protect binaries; disk encryption is a separate at-rest control.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ac9c1"/></marker></defs><rect width="1000" height="620" fill="#101820"/><text x="36" y="42" fill="#67d5c4" font-size="24" font-weight="700">FortiManager platform integrity chain</text><text x="36" y="70" fill="#a9bac4" font-size="14">Boot trust, runtime code integrity and storage confidentiality are separate controls</text><line x1="110" y1="262.5" x2="325" y2="262.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="217.5" y="254.5" fill="#d4e6e2" font-size="13" text-anchor="middle">boot</text><line x1="325" y1="262.5" x2="555" y2="262.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="440" y="254.5" fill="#d4e6e2" font-size="13" text-anchor="middle">signature valid</text><line x1="555" y1="262.5" x2="785" y2="262.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="670" y="254.5" fill="#d4e6e2" font-size="13" text-anchor="middle">load hashes</text><line x1="785" y1="262.5" x2="935" y2="167.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="860" y="207" fill="#d4e6e2" font-size="13" text-anchor="middle">hash match</text><line x1="785" y1="262.5" x2="935" y2="357.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="860" y="302" fill="#d4e6e2" font-size="13" text-anchor="middle">missing/mismatch</text><line x1="490" y1="465" x2="555" y2="262.5" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="522.5" y="355.75" fill="#d4e6e2" font-size="13" text-anchor="middle">separate storage layer</text><rect x="40" y="220" width="140" height="85" rx="12" fill="#1c3543" stroke="#70cfc0" stroke-width="2"/><text x="110" y="253.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="110" dy="0">Power-on</tspan><tspan x="110" dy="18">firmware</tspan></text><rect x="240" y="220" width="170" height="85" rx="12" fill="#1c3543" stroke="#70cfc0" stroke-width="2"/><text x="325" y="253.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="325" dy="0">UEFI Secure Boot</tspan><tspan x="325" dy="18">+ TPM trust</tspan></text><rect x="470" y="220" width="170" height="85" rx="12" fill="#1c3543" stroke="#70cfc0" stroke-width="2"/><text x="555" y="253.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="555" dy="0">Signed root FS</tspan><tspan x="555" dy="18">and executables</tspan></text><rect x="700" y="220" width="170" height="85" rx="12" fill="#1c3543" stroke="#70cfc0" stroke-width="2"/><text x="785" y="253.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="785" dy="0">RT-FSIC hash gate</tspan><tspan x="785" dy="18">runtime checks</tspan></text><rect x="880" y="130" width="110" height="75" rx="12" fill="#23443e" stroke="#70cfc0" stroke-width="2"/><text x="935" y="158.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">Normal process</tspan><tspan x="935" dy="18">start</tspan></text><rect x="880" y="320" width="110" height="75" rx="12" fill="#49352a" stroke="#70cfc0" stroke-width="2"/><text x="935" y="348.5" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="935" dy="0">Block binary</tspan><tspan x="935" dy="18">and reboot</tspan></text><rect x="350" y="430" width="280" height="70" rx="12" fill="#3a354a" stroke="#70cfc0" stroke-width="2"/><text x="490" y="456" fill="#f2f7f8" font-size="15" font-weight="600" text-anchor="middle"><tspan x="490" dy="0">Self-encrypting drive</tspan><tspan x="490" dy="18">at-rest protection</tspan></text><text x="36" y="590" fill="#a9bac4" font-size="12">Fortinet Daily Study Report · 2026-11-25</text></svg>