<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">fortinacf mechanism flow</title><desc id="desc">Four-stage technical flow for fortinacf.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245d86"/></marker></defs><rect x="0" y="0" width="1000" height="560" rx="20" fill="#f5f8fc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#12334c">FORTINACF — MECHANISM FLOW</text><path d="M700 260 L20 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="365" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">direct ICMP/TCP</text><path d="M700 260 L260 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="485" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">indirect check</text><path d="M700 260 L740 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="725" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">promotion state</text><path d="M940 260 L20 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="485" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">manual Resume Control</text><rect x="30" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="125" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Primary CA A</text><text x="125" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Direct check</text><rect x="270" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="365" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Primary CA B</text><text x="365" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Indirect check peer</text><rect x="510" y="210" width="190" height="100" rx="14" fill="#e8f1fb" stroke="#1e5a84" stroke-width="3"/><text x="605" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Secondary CA</text><text x="605" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Standby / decision</text><rect x="750" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="845" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">FortiNAC-M</text><text x="845" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Promoted status / control</text><text x="36" y="500" font-family="Arial,sans-serif" font-size="14" fill="#405a70">Use the lesson text to validate each boundary; configuration presence alone does not prove runtime success.</text></svg>