<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">sdwan mechanism flow</title><desc id="desc">Four-stage technical flow for sdwan.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245d86"/></marker></defs><rect x="0" y="0" width="1000" height="560" rx="20" fill="#f5f8fc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#12334c">SDWAN — MECHANISM FLOW</text><path d="M220 260 L260 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="245" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">received route</text><path d="M460 260 L500 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="485" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">set-route-tag</text><path d="M700 260 L740 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="725" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">dynamic destination</text><rect x="30" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="125" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">BGP neighbor</text><text x="125" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Prefix + community</text><rect x="270" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="365" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Inbound route-map</text><text x="365" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Match community</text><rect x="510" y="210" width="190" height="100" rx="14" fill="#e8f1fb" stroke="#1e5a84" stroke-width="3"/><text x="605" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Local route tag</text><text x="605" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Tag address object</text><rect x="750" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="845" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">SD-WAN service</text><text x="845" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Member selection</text><text x="36" y="500" font-family="Arial,sans-serif" font-size="14" fill="#405a70">Use the lesson text to validate each boundary; configuration presence alone does not prove runtime success.</text></svg>