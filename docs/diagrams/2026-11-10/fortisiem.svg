<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">fortisiem mechanism flow</title><desc id="desc">Four-stage technical flow for fortisiem.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#245d86"/></marker></defs><rect x="0" y="0" width="1000" height="560" rx="20" fill="#f5f8fc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#12334c">FORTISIEM — MECHANISM FLOW</text><path d="M220 260 L260 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="245" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">match</text><path d="M460 260 L500 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="485" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">group</text><path d="M700 260 L740 260" stroke="#245d86" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="725" y="245" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#245d86">threshold met</text><rect x="30" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="125" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Normalized events</text><text x="125" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Attribute filters</text><rect x="270" y="210" width="190" height="100" rx="14" fill="#ffffff" stroke="#1e5a84" stroke-width="3"/><text x="365" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#15354f">Subpattern</text><text x="365" y="276" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#405a70">Group By keys</text><rect x="510"