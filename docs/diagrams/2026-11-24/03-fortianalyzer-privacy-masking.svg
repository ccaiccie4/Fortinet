<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiAnalyzer privacy masking and unmask path</title><desc id="desc">Log downloads omit masked values; time-frame masking does not apply to real-time logs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiAnalyzer privacy masking and unmask path</text><line x1="161.60000000000002" y1="220" x2="258.4" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="210" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">profile applied</text><line x1="390" y1="220" x2="500" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="445" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">mask</text><line x1="649.8" y1="220" x2="775.2" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="712.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">See Original Data</text><line x1="649.8" y1="334" x2="775.2" y2="262" stroke="#8b6a2b" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="712.5" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8b6a2b">key validation</text><rect x="25" y="170" width="150" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="100" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Log records</text><text x="100" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">source / user / host</text><text x="100" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">fields</text><rect x="235" y="170" width="170" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="320" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Admin profile</text><text x="320" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">selected fields</text><text x="320" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">0–365 day window</text><rect x="475" y="170" width="190" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="570" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Masked view</text><text x="570" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">per-admin anonymized</text><text x="570" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">values change at login</text><rect x="475" y="330" width="190" height="80" rx="12" fill="#fff8e8" stroke="#35566f" stroke-width="1.5"/><text x="570" y="357.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Data Mask Key</text><text x="570" y="374.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">Screen Picker or</text><text x="570" y="391.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">Manual Input</text><rect x="755" y="170" width="200" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="855" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Selective reveal</text><text x="855" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">only selected field</text><text x="855" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">other fields stay masked</text><text x="24" y="424" font-family="Arial,sans-serif" font-size="12" fill="#526b7d">Log downloads omit masked values; time-frame masking does not apply to real-time logs.</text></svg>