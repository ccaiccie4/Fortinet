<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiAuthenticator FIDO IdP-initiated SAML flow</title><desc id="desc">FIDO success proves IdP authentication; SP visibility and assertion acceptance are separate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiAuthenticator FIDO IdP-initiated SAML flow</text><line x1="151.60000000000002" y1="216.4" x2="248.39999999999998" y2="218.6" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="200" y="209.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">identify</text><line x1="378.6" y1="220" x2="486.4" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="432.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">IdP auth</text><line x1="618" y1="220" x2="717" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="667.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">select SP</text><line x1="826.2" y1="220" x2="904.5" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="865.35" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">assertion</text><rect x="20" y="170" width="140" height="90" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="90" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Bro