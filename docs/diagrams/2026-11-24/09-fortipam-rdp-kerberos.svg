<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiPAM native RDP Kerberos NLA transaction</title><desc id="desc">Kerberos is supported for native RDP NLA only; the KDC Address is optional.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiPAM native RDP Kerberos NLA transaction</text><line x1="169.4" y1="220" x2="270.6" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="220" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">secret domain</text><line x1="400.8" y1="220" x2="504.2" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="452.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">realm</text><line x1="633" y1="220" x2="732" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="682.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">KDC</text><line x1="837" y1="220" x2="904.5" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="870.75" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">ticket</text><rect x="20" y="170" width="170" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="105" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Secret / target</text><text x="105" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">domain + credentials</text><text x="105" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">NLA enabled</text><rect x="250" y="170" width="170" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="335" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Realm derivation</text><text x="335" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">domain from secret</text><text x="335" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">or target</text><rect x="485" y="170" width="170" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="570" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">KDC discovery</text><text x="570" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">DNS SRV or</text><text x="570" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">explicit KDC:88</text><rect x="720" y="170" width="150" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="795" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Kerberos ticket</text><text x="795" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">ticket request</text><text x="795" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">and response</text><rect x="900" y="170" width="90" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="945" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Native RDP NLA</text><text x="945" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">CredSSP to target</text><text x="945" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">Web RDP excluded</text><text x="24" y="424" font-family="Arial,sans-serif" font-size="12" fill="#526b7d">Kerberos is supported for native RDP NLA only; the KDC Address is optional.</text></svg>