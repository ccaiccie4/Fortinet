<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiNAC-F machine authentication and host-group RBAC</title><desc id="desc">Machine authorization is separate from interactive user login; primary AD groups are not supported.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiNAC-F machine authentication and host-group RBAC</text><line x1="164.8" y1="220" x2="262.7" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="213.75" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">machine identity</text><line x1="388.7" y1="220" x2="488.8" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="438.75" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">Access-Request</text><line x1="619" y1="187.8" x2="723.5" y2="137.2" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="671.25" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">directory lookup</text><line x1="790" y1="145.5" x2="790" y2="304.5" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="790" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">host group mapping</text><rect x="20" y="170" width="165" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="102.5" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fon