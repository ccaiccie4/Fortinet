<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiManager HA replication and failover</title><desc id="desc">Heartbeat and module synchronization are distinct; peer-local settings are not replicated.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiManager HA replication and failover</text><line x1="159.5" y1="226.4" x2="253" y2="228.6" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="206.25" y="219.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">change</text><line x1="388.8" y1="230" x2="508.7" y2="230" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="448.75" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">heartbeat + sync</text><line x1="657.8" y1="195" x2="772.2" y2="140" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="715" y="159.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">promotion</text><line x1="845" y1="145.5" x2="845" y2="304.5" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="845" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">new primary path</text><rect x="25" y="180" width="150" height="90" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="100" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Administrator</text><text x=