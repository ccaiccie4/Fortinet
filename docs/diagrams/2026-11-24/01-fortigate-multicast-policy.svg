<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiGate multicast policy and translation path</title><desc id="desc">Policy scope is separate from multicast routing; all-to-all virtual-link policy can loop.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiGate multicast policy and translation path</text><line x1="154.60000000000002" y1="220" x2="240.39999999999998" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="197.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">ingress</text><line x1="351" y1="220" x2="439" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="395" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">eligible</text><line x1="549.6" y1="220" x2="635.4" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="592.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">match</text><line x1="745.3" y1="220" x2="832.2" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="788.75" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">egress</text><line x1="497.8" y1="262" x2="502.2" y2="334" stroke="#b94b35" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#redarrow)"/><text x="500" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#b94b35">broad an