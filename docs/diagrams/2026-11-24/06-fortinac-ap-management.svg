<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">FortiNAC Access Point Management DHCP and DNS state paths</title><desc id="desc">Host state is enforced through DHCP pool and DNS behavior, not per-host VLAN switching.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35566f"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b94b35"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#ffffff"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324a">FortiNAC Access Point Management DHCP and DNS state paths</text><line x1="163.4" y1="220" x2="259.1" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="211.25" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">DHCP</text><line x1="383" y1="220" x2="482" y2="220" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="432.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">lease lookup</text><line x1="616.4" y1="187.8" x2="728.6" y2="137.2" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="672.5" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">authorized</text><line x1="616.4" y1="255" x2="728.6" y2="310" stroke="#35566f" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="672.5" y="274.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#35566f">unauthorized</text><rect x="20" y="170" width="165" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="102.5" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Host behind AP</text><text x="102.5" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">shared VLAN</text><text x="102.5" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">no per-client VLAN</text><rect x="245" y="170" width="150" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="320" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">DHCP relay</text><text x="320" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">requests to</text><text x="320" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">FortiNAC</text><rect x="455" y="170" width="180" height="100" rx="12" fill="#eef5fb" stroke="#35566f" stroke-width="1.5"/><text x="545" y="207.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">FortiNAC state</text><text x="545" y="224.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">lease + host state</text><text x="545" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">pool selection</text><rect x="710" y="60" width="180" height="90" rx="12" fill="#edf7ef" stroke="#35566f" stroke-width="1.5"/><text x="800" y="92.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Authorized path</text><text x="800" y="109.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">production pool</text><text x="800" y="126.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">production DNS</text><rect x="710" y="300" width="180" height="90" rx="12" fill="#fff0e9" stroke="#35566f" stroke-width="1.5"/><text x="800" y="332.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324a">Restricted path</text><text x="800" y="349.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">restricted pool</text><text x="800" y="366.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#34536a">portal DNS</text><text x="24" y="424" font-family="Arial,sans-serif" font-size="12" fill="#526b7d">Host state is enforced through DHCP pool and DNS behavior, not per-host VLAN switching.</text></svg>