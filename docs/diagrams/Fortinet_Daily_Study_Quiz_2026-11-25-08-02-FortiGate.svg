<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><title>FortiGate explicit proxy isolation flow</title><desc>Browser PAC decision branches to direct egress or explicit proxy; policy branches to normal forwarder or isolator.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ac9c1"/></marker></defs><rect width="1000" height="620" fill="#101820"/><text x="36" y="42" fill="#67d5c4" font-size="24" font-weight="700">FortiGate explicit proxy isolation flow</text><text x="36" y="70" fill="#a9bac4" font-size="14">PAC decision is separate from proxy policy and isolator health</text><line x1="115" y1="135" x2="115" y2="285" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="115" y="202" fill="#d4e6e2" font-size="13" text-anchor="middle">PAC file + TLS trust</text><line x1="115" y1="285" x2="360" y2="285" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="237.5" y="277" fill="#d4e6e2" font-size="13" text-anchor="middle">PROXY</text><line x1="115" y1="285" x2="360" y2="470" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="237.5" y="369.5" fill="#d4e6e2" font-size="13" text-anchor="middle">DIRECT</text><line x1="360" y1="285" x2="600" y2="285" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="480" y="277" fill="#d4e6e2" font-size="13" text-anchor="middle">HTTP/HTTPS session</text><line x1="600" y1="285" x2="870" y2="165" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="735" y="217" fill="#d4e6e2" font-size="13" text-anchor="middle">accept</text><line x1="600" y1="285" x2="870" y2="405" stroke="#9ac9c1" stroke-width="2.5" marker-end="url(#arr)"/><text x="735" y="337" fill="#d4e6e2" font-size="13" text-anchor="middle">isolate</text><rect x="40" y="240" width="150" height="90" rx="12" fill="#1c3543" stroke="#70cfc0" stroke-width="2"/