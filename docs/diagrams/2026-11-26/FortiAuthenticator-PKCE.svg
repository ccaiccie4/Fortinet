<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">OAuth Authorization Code with PKCE</title><desc id="d">Technical mechanism diagram for OAuth Authorization Code with PKCE. Arrows identify the control, packet, authentication, or configuration flow.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b6b82"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="48" y="58" font-size="30" font-weight="700" fill="#132b45">OAuth Authorization Code with PKCE</text><text x="48" y="90" font-size="16" fill="#5b6472">Fortinet Enterprise Networking &amp; Security — 2026-11-26</text><g><path d="M 200 185 L 585 185" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="392.5" y="175" text-anchor="middle" font-size="15" fill="#344054">hash verifier</text></g><g><path d="M 585 185 L 970 185" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="777.5" y="175" text-anchor="middle" font-size="15" fill="#344054">authorize request</text></g><g><path d="M 970 185 L 200 385" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="585" y="275" text-anchor="middle" font-size="15" fill="#344054">302 redirect</text></g><g><path d="M 200 385 L 585 385" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="392.5" y="375" text-anchor="middle" font-size="15" fill="#344054">successful login</text></g><g><path d="M 585 385 L 970 385" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="777.5" y="375" text-anchor="middle" font-size="15" fill="#344054">token exchange</text></g><g><path d="M 200 185 L 970 385" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="585" y="275" text-anchor="middle" font-size="15" fill="#344054">send verifier</text></g><g><path d="M 970 385 L 200 585" fill="none" stroke="#5b6b82" stroke-width="3" marker-end="url(#arr)"/><text x="585" y="475" text-anchor="middle" font-size="15" fill="#344054">SHA-256 match</text></g><g><rect x="45" y="130" width="310" height="110" rx="18" fill="#e8f5f2" stroke="#385d7a" stroke-width="2"/><text x="200" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">Public client</text><text x="200" y="205" text-anchor="middle" font-size="16" fill="#344054">Generate verifier</text></g><g><rect x="430" y="130" width="310" height="110" rx="18" fill="#eef4ff" stroke="#385d7a" stroke-width="2"/><text x="585" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">S256 challenge</text><text x="585" y="205" text-anchor="middle" font-size="16" fill="#344054">code_challenge</text></g><g><rect x="815" y="130" width="310" height="110" rx="18" fill="#e8f5f2" stroke="#385d7a" stroke-width="2"/><text x="970" y="172" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">/oauth/authorize</text><text x="970" y="205" text-anchor="middle" font-size="16" fill="#344054">Client ID + redirect + challenge</text></g><g><rect x="45" y="330" width="310" height="110" rx="18" fill="#eef4ff" stroke="#385d7a" stroke-width="2"/><text x="200" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">FAC login portal</text><text x="200" y="405" text-anchor="middle" font-size="16" fill="#344054">Authenticate user</text></g><g><rect x="430" y="330" width="310" height="110" rx="18" fill="#e8f5f2" stroke="#385d7a" stroke-width="2"/><text x="585" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">Authorization code</text><text x="585" y="405" text-anchor="middle" font-size="16" fill="#344054">Return to callback</text></g><g><rect x="815" y="330" width="310" height="110" rx="18" fill="#eef4ff" stroke="#385d7a" stroke-width="2"/><text x="970" y="372" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">/oauth/token</text><text x="970" y="405" text-anchor="middle" font-size="16" fill="#344054">code + code_verifier</text></g><g><rect x="45" y="530" width="310" height="110" rx="18" fill="#e8f5f2" stroke="#385d7a" stroke-width="2"/><text x="200" y="572" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">Access token</text><text x="200" y="605" text-anchor="middle" font-size="16" fill="#344054">Issued only on match</text></g><text x="48" y="670" font-size="14" fill="#667085">Interpretation: arrows show the relevant transaction or forwarding relationship; verify each stage independently.</text></svg>