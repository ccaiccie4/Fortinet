<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#40536a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#14243a">FortiAnalyzer — Real-time log forwarding: filters, masking and reliable TCP buffering</text><text x="24" y="66" font-family="Arial" font-size="12" fill="#536273">Mechanism / transaction flow · read left to right</text><rect x="24" y="124" width="168" height="86" rx="10" fill="#e8f1ff" stroke="#42566e" stroke-width="1.5"/><text x="108" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">Incoming FAZ logs</text><line x1="194" y1="167" x2="214" y2="167" stroke="#40536a" stroke-width="2" marker-end="url(#a)"/><text x="206" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">arrive at source</text><rect x="220" y="124" width="168" height="86" rx="10" fill="#eaf7ef" stroke="#42566e" stroke-width="1.5"/><text x="304" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">Forwarding profile /</text><text x="304" y="172" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">filters</text><line x1="390" y1="167" x2="410" y2="167" stroke="#40536a" stroke-width="2" marker-end="url(#a)"/><text x="402" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">filter, exclude and mask</text><rect x="416" y="124" width="168" height="86" rx="10" fill="#fff3df" stroke="#42566e" stroke-width="1.5"/><text x="500" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">TCP buffer or UDP</text><text x="500" y="172" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">sender</text><line x1="586" y1="167" x2="606" y2="167" stroke="#40536a" stroke-width="2" marker-end="url(#a)"/><text x="598" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">transport and buffer</text><rect x="612" y="124" width="168" height="86" rx="10" fill="#f1edff" stroke="#42566e" stroke-width="1.5"/><text x="696" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">Remote FAZ / syslog</text><text x="696" y="172" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">/ CEF</text><line x1="782" y1="167" x2="802" y2="167" stroke="#40536a" stroke-width="2" marker-end="url(#a)"/><text x="794" y="108" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">authorize and index</text><rect x="808" y="124" width="168" height="86" rx="10" fill="#e8f4f4" stroke="#42566e" stroke-width="1.5"/><text x="892" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">Receiver</text><text x="892" y="172" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">authorization /</text><text x="892" y="189" text-anchor="middle" font-family="Arial" font-size="12" fill="#152235">indexing</text><text x="24" y="282" font-family="Arial" font-size="11" fill="#536273">Each boundary must be verified independently; an upstream success does not prove downstream enforcement.</text></svg>