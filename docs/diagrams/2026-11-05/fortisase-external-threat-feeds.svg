="3" marker-end="url(#arr)"/><rect x="710" y="115" width="190" height="130" rx="14" fill="#fff" stroke="#315a78" stroke-width="2"/><text x="724" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Central sync</text><text x="724" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">profile + feed</text><rect x="940" y="115" width="190" height="130" rx="14" fill="#e7f4ec" stroke="#315a78" stroke-width="2"/><text x="954" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">FortiSASE</text><text x="954" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">cache + enforcement</text><rect x="25" y="300" width="1150" height="112" rx="12" fill="#fff4df" stroke="#c58b2a"/><text x="45" y="340" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#704b0c">Operational boundary</text><text x="45" y="373" font-family="Arial,sans-serif" font-size="15" fill="#5e4a26">Only feeds referenced by Web/DNS profiles synchronize; HTTP Basic Auth credentials must be entered in FortiSASE.</text><text x="28" y="448" font-family="Arial,sans-serif" font-size="12" fill="#657b8b">Fortinet Daily Study • 2026-11-05</text></svg>