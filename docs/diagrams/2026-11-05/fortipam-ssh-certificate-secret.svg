<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">FortiPAM SSH Certificate Secret</title><desc id="d">FortiPAM displays certificate validity; the target SSH daemon must still trust the CA and principal.</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#315a78"/></marker></defs><rect width="1200" height="470" fill="#f7fafc"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#16324a">FortiPAM SSH Certificate Secret</text><line x1="210" y1="180" x2="242" y2="180" stroke="#315a78" stroke-width="3" marker-end="url(#arr)"/><rect x="20" y="115" width="190" height="130" rx="14" fill="#e5f0f7" stroke="#315a78" stroke-width="2"/><text x="34" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">SSH-key template</text><text x="34" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">FortiProduct / Unix</text><line x1="440" y1="180" x2="472" y2="180" stroke="#315a78" stroke-width="3" marker-end="url(#arr)"/><rect x="250" y="115" width="190" height="130" rx="14" fill="#fff" stroke="#315a78" stroke-width="2"/><text x="264" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Certificate key</text><text x="264" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">public key + cert</text><line x1="670" y1="180" x2="702" y2="180" stroke="#315a78" stroke-width="3" marker-end="url(#arr)"/><rect x="480" y="115" width="190" height="130" rx="14" fill="#fff" stroke="#315a78" stroke-width="2"/><text x="494" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Secret details</text><text x="494" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">validity / status</text><line x1="900" y1="180" x2="932" y2="180" stroke="#315a78" stroke-width="3" marker-end="url(#arr)"/><rect x="710" y="115" width="190" height="130" rx="14" fill="#fff" stroke="#315a78" stroke-width="2"/><text x="724" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Launcher</text><text x="724" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">credential use</text><rect x="940" y="115" width="190" height="130" rx="14" fill="#e7f4ec" stroke="#315a78" stroke-width="2"/><text x="954" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">SSH target</text><text x="954" y="191" font-family="Arial,sans-serif" font-size="14" fill="#334e62">CA / principal check</text><rect x="25" y="300" width="1150" height="112" rx="12" fill="#fff4df" stroke="#c58b2a"/><text x="45" y="340" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#704b0c">Operational boundary</text><text x="45" y="373" font-family="Arial,sans-serif" font-size="15" fill="#5e4a26">FortiPAM displays certificate validity; the target SSH daemon must still trust the CA and principal.</text><text x="28" y="448" font-family="Arial,sans-serif" font-size="12" fill="#657b8b">Fortinet Daily Study • 2026-11-05</text></svg>