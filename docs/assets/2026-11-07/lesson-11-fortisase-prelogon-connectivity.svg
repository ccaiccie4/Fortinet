<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc"><title id="title">FortiSASE pre-logon connectivity</title><desc id="desc">Machine certificate reaches AD before the first Windows user login</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#47627d"/></marker></defs><rect width="1240" height="570" fill="#f7f9fc"/><text x="32" y="42" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">FortiSASE pre-logon connectivity</text><text x="32" y="70" font-family="Arial" font-size="15" fill="#52677d">Machine certificate reaches AD before the first Windows user login</text><line x1="32" y1="90" x2="1208" y2="90" stroke="#d7e0ea" stroke-width="2"/><path d="M 205 280 H 244 V 280 H 280" fill="none" stroke="#47627d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="244" y="272" text-anchor="middle" font-family="Arial" font-size="12" fill="#344b63">boot profile</text><path d="M 460 280 H 499 V 280 H 535" fill="none" stroke="#47627d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="499" y="272" text-anchor="middle" font-family="Arial" font-size="12" fill="#344b63">machine identity</text><path d="M 720 280 H 761.6 V 280 H 800" fill="none" stroke="#47627d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="761.6" y="272" text-anchor="middle" font-family="Arial" font-size="12" fill="#344b63">AD reachability</text><path d="M 980 280 H 886.4 V 437.5 H 800" fill="none" stroke="#47627d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="886.4" y="350.75" text-anchor="middle" font-family="Arial" font-size="12" fill="#344b63">user login</text><path d="M 980 437.5 H 1016.4 V 280 H 1050" fill="none" stroke="#47627d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1016.4" y="350.75" text-anchor="middle" font-family="Arial" font-size="12" fill="#344b63">transition</text><rect x="35" y="235" width="170" height="90" rx="12" fill="#e6f0fb" stroke="#45617c" stroke-width="2"/><text x="120" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="120" dy="0">Windows boot</tspan><tspan x="120" dy="21">no cached user creds</tspan></text><rect x="280" y="235" width="180" height="90" rx="12" fill="#edf2f7" stroke="#45617c" stroke-width="2"/><text x="370" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="370" dy="0">Machine certificate</tspan><tspan x="370" dy="21">pre-logon auth</tspan></text><rect x="535" y="235" width="185" height="90" rx="12" fill="#edf2f7" stroke="#45617c" stroke-width="2"/><text x="627.5" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="627.5" dy="0">Temporary tunnel</tspan><tspan x="627.5" dy="21">FortiSASE gateway</tspan></text><rect x="800" y="235" width="180" height="90" rx="12" fill="#fff2d9" stroke="#45617c" stroke-width="2"/><text x="890" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="890" dy="0">Active Directory</tspan><tspan x="890" dy="21">first domain login</tspan></text><rect x="800" y="400" width="180" height="75" rx="12" fill="#fbe9e7" stroke="#45617c" stroke-width="2"/><text x="890" y="427.5" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="890" dy="0">Pre-logon tunnel</tspan><tspan x="890" dy="21">teardown</tspan></text><rect x="1050" y="235" width="160" height="90" rx="12" fill="#e5f4ea" stroke="#45617c" stroke-width="2"/><text x="1130" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324d"><tspan x="1130" dy="0">User tunnel</tspan><tspan x="1130" dy="21">autoconnect / PoP</tspan></text><text x="32" y="545" font-family="Arial" font-size="12" fill="#63778b">Fortinet Enterprise Networking &amp; Security • 2026-11-07</text></s