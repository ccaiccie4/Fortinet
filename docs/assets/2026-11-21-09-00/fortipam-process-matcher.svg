or="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Matcher</text><text x="625" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Default / Window</text><text x="625" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Title / Command</text></g><g><rect x="770" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="784" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 4</text><text x="870" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Full-screen</text><text x="870" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">recording +</text><text x="870" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">audit trail</text></g><rect x="35" y="300" width="930" height="55" rx="10" fill="#fff7e8" stroke="#d6a44b"/><text x="55" y="333" font-family="Arial,sans-serif" font-size="15" fill="#6b4b16">Custom matchers force multiprocess observation and full-screen recording.</text></svg>