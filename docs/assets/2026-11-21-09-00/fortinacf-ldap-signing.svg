<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#426b91"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><text x="35" y="55" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">FortiNAC-F secure LDAP bind</text><path d="M 235 201 L 280 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 480 201 L 525 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 725 201 L 770 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="35" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="49" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 1</text><text x="135" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">FortiNAC-F</text><text x="135" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">LDAP simple</text><text x="135" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">bind request</text></g><g><rect x="280" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="294" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 2</text><text x="380" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">TCP 389</text><text x="380" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">cleartext</text><text x="380" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">rejected</text></g><g><rect x="525" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="539" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 3</text><text x="625" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">STARTTLS 389</text><text x="625" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">or LDAPS 636</text><text x="625" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">trusted TLS</text></g><g><rect x="770" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="784" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 4</text><text x="870" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Active Directory</text><text x="870" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">LDAP signing</text><text x="870" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">policy</text></g><rect x="35" y="300" width="930" height="55" rx="10" fill="#fff7e8" stroke="#d6a44b"/><text x="55" y="333" font-family="Arial,sans-serif" font-size="15" fill="#6b4b16">Keep signing required; use TLS-protected LDAP with a trusted CA and matching FQDN.</text></svg>