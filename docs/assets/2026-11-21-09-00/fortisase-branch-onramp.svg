<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#426b91"/></marker></defs><rect width="1000" height="390" fill="#fff"/><text x="35" y="55" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">FortiSASE Branch On-ramp routing</text><path d="M 235 201 L 280 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 480 201 L 525 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 725 201 L 770 201" stroke="#426b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g><rect x="35" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="49" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 1</text><text x="135" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Branch endpoints</text><text x="135" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">use edge as</text><text x="135" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">default gateway</text></g><g><rect x="280" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="294" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 2</text><text x="380" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">Branch IPsec edge</text><text x="380" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">one or more</text><text x="380" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">LANs</text></g><g><rect x="525" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="539" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 3</text><text x="625" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">FortiSASE On-ramp</text><text x="625" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">security PoP</text><text x="625" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">FWaaS</text></g><g><rect x="770" y="145" width="200" height="112" rx="14" fill="#eef4fb" stroke="#426b91" stroke-width="2"/><text x="784" y="167" font-family="Arial,sans-serif" font-size="12" fill="#56738f">STEP 4</text><text x="870" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">BGP per overlay</text><text x="870" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">or static + SNAT</text><text x="870" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">return path</text></g><rect x="35" y="300" width="930" height="55" rx="10" fill="#fff7e8" stroke="#d6a44b"/><text x="55" y="333" font-family="Arial,sans-serif" font-size="15" fill="#6b4b16">BGP per overlay preserves client source IP visibility; static routing requires SNAT.</text></svg>