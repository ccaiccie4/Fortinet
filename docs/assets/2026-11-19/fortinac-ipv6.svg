<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">FortiNAC IPv6 support boundary</title><desc id="desc">Endpoint IPv6 visibility does not mean network-device Inventory discovery is IPv6-only capable.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#46627c"/></marker></defs><rect width="1000" height="420" rx="18" fill="#f7f9fc"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">FortiNAC IPv6 support boundary</text><line x1="220" y1="106" x2="300" y2="106" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">IPv6 supported</text><line x1="220" y1="286" x2="300" y2="286" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">IPv6 supported</text><line x1="490" y1="129.22222222222223" x2="650" y2="168.33333333333334" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="570" y="140.77777777777777" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">separate management plane</text><line x1="490" y1="267" x2="650" y2="235" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="570" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">IPv4 required for discovery</text><rect x="30" y="65" width="190" height="82" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="125" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">IPv6 endpoint</text><text x="125" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Portal / Agent</text><rect x="300" y="65" width="190" height="82" rx="12" fill="#eaf9f0" stroke="#56738f" stroke-width="2"/><text x="395" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">FortiNAC eth1</text><text x="395" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Portal + Agent</text><rect x="30" y="245" width="190" height="82" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="125" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Admin workstation</text><text x="125" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">IPv6</text><rect x="300" y="245" width="190" height="82" rx="12" fill="#eaf9f0" stroke="#56738f" stroke-width="2"/><text x="395" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">FortiNAC eth0</text><text x="395" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Admin UI</text><rect x="650" y="155" width="300" height="100" rx="12" fill="#fff5df" stroke="#56738f" stroke-width="2"/><text x="800" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Managed switch / router</text><text x="800" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Inventory discovery via IPv4</text><rect x="24" y="365" width="952" height="34" rx="8" fill="#edf2f7" stroke="#c4d0dc"/><text x="40" y="387" font-family="Arial,sans-serif" font-size="13" fill="#334e68">Endpoint IPv6 visibility does not mean network-device Inventory discovery is IPv6-only capable.</text></svg>