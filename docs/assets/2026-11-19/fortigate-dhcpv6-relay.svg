<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">FortiGate DHCPv6 relay</title><desc id="desc">Evidence gate: diagnose sys udpsock6 must show dhcp6r listening on UDP/547.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#46627c"/></marker></defs><rect width="1000" height="420" rx="18" fill="#f7f9fc"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">FortiGate DHCPv6 relay</text><line x1="200" y1="188" x2="260" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="230" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">Solicit / Request</text><line x1="450" y1="188" x2="510" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">relay service enabled</text><line x1="700" y1="188" x2="790" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">Forward / Relay-Forward</text><line x1="790" y1="188" x2="700" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">Reply</text><line x1="510" y1="188" x2="200" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="355" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">Forward reply</text><rect x="30" y="145" width="170" height="86" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="115" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">IPv6 client