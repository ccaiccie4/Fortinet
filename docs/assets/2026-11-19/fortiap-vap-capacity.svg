<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">FortiAP per-radio VAP capacity</title><desc id="desc">Sixteen VAPs are supported only on selected G/K models; keep SSID count low to reduce congestion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#46627c"/></marker></defs><rect width="1000" height="420" rx="18" fill="#f7f9fc"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">FortiAP per-radio VAP capacity</text><line x1="210" y1="188" x2="270" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">global ceiling</text><line x1="450" y1="155.6" x2="520" y2="130.4" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="485" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">assign VAPs</text><line x1="450" y1="224" x2="520" y2="252" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="485" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">assign VAPs</text><line x1="700" y1="128.2803738317757" x2="790" y2="158.5607476635514" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="135.42056074766356" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">beacons / join</text><line x1="700" y1="254.3551401869159" x2="790" y2="220.71028037383178" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745" y="229.53271028037383" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">beacons / join</text><rect x="30" y="145" width="180" height="86" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="120" y="18