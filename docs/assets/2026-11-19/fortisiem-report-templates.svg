<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">FortiSIEM report template resolution</title><desc id="desc">Report-specific template wins; otherwise current folder; otherwise system root template.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#46627c"/></marker></defs><rect width="1000" height="420" rx="18" fill="#f7f9fc"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">FortiSIEM report template resolution</text><line x1="200" y1="156.72" x2="270" y2="130.95999999999998" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="235" y="135.83999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">first choice</text><line x1="200" y1="221.32" x2="270" y2="248.76" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="235" y="227.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">if no report template</text><line x1="460" y1="112.64761904761905" x2="810" y2="173.98095238095237" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="635" y="135.31428571428572" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">resolved</text><line x1="460" y1="252.75" x2="550" y2="221.25" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="505" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">if no folder template</text><line x1="740" y1="188" x2="810" y2="188" stroke="#46627c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="775" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68">fallback</text><rect x="30" y="145" width="170" height="86" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="115" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Selected report</text><text x="115" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Resources &gt; Reports</text><rect x="270" y="55" width="190" height="82" rx="12" fill="#eaf9f0" stroke="#56738f" stroke-width="2"/><text x="365" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Report-specific</text><text x="365" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">template</text><rect x="270" y="245" width="190" height="82" rx="12" fill="#fff5df" stroke="#56738f" stroke-width="2"/><text x="365" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Current folder</text><text x="365" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">template</text><rect x="550" y="145" width="190" height="86" rx="12" fill="#f2eaff" stroke="#56738f" stroke-width="2"/><text x="645" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">Root folder</text><text x="645" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">system template</text><rect x="810" y="145" width="160" height="86" rx="12" fill="#eaf4ff" stroke="#56738f" stroke-width="2"/><text x="890" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17324d">PDF renderer</text><text x="890" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17324d">Preview / Export</text><rect x="24" y="365" width="952" height="34" rx="8" fill="#edf2f7" stroke="#c4d0dc"/><text x="40" y="387" font-family="Arial,sans-serif" font-size="13" fill="#334e68">R