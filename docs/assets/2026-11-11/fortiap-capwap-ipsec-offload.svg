<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">FortiAP CAPWAP control and data channels</title><desc id="desc">Mechanism flow diagram for FortiAP CAPWAP control and data channels.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657a"/></marker></defs><style>.node{font:600 18px Arial,sans-serif;fill:#183149}.edge{font:13px Arial,sans-serif;fill:#40556a}.sub{font:14px Arial,sans-serif;fill:#60748a}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="70" font-family="Arial" font-size="27" font-weight="700" fill="#17324d">FortiAP CAPWAP control and data channels</text><text x="50" y="105" class="sub">Control flow, decision points and evidence boundary</text><line x1="240" y1="276" x2="278.66666666666663" y2="276" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/><text x="263.3333333333333" y="258" text-anchor="middle" class="edge">client packets</text><line x1="476.66666666666663" y1="276" x2="515.3333333333333" y2="276" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/><text x="499.99999999999994" y="258" text-anchor="middle" class="edge">management channel</text><line x1="476.66666666666663" y1="276" x2="752" y2="276" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/><text x="618.3333333333333" y="258" text-anchor="middle" class="edge">client-data channel</text><rect x="50" y="220" width="190" height="112" rx="16" fill="#eef3f8" stroke="#47627d" stroke-width="2"/><text x="145" y="260" text-anchor="middle" class="node"><tspan x="145" dy="0">Wireless client</tspan><tspan x="145" dy="28">radio security</tspan></text><rect x="286.66666666666663" y="220" width="190" height="112" rx="16" fill="#eef3f8" stroke="#47627d" stroke-width="2"/><text x="381.66666666666663" y="260" text-anchor="middle" class="node"><tspan x="381.66666666666663" dy="0">FortiAP</tspan><tspan x="381.66666666666663" dy="28">WTP profile</tspan></text><rect x="523.3333333333333" y="220" width="190" height="112" rx="16" fill="#eef3f8" stroke="#47627d" stroke-width="2"/><text x="618.3333333333333" y="260" text-anchor="middle" class="node"><tspan x="618.3333333333333" dy="0">CAPWAP control</tspan><tspan x="618.3333333333333" dy="28">DTLS always</tspan></text><rect x="760" y="220" width="190" height="112" rx="16" fill="#eef3f8" stroke="#47627d" stroke-width="2"/><text x="855" y="260" text-anchor="middle" class="node"><tspan x="855" dy="0">CAPWAP data</tspan><tspan x="855" dy="28">IPsec + offload</tspan></text><text x="50" y="500" class="sub">Read left to right: each arrow represents a distinct protocol or policy transition.</text></svg>