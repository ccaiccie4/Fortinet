<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiAnalyzer — active-active geo-redundant HA"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiAnalyzer — active-active geo-redundant HA</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Two routed data centers can both ingest and forward local logs</text><path d="M175 111 L197.5 111 L197.5 125 L215 125" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="197.5" y="111" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">local ingest</text><path d="M410 125 L427.5 125 L427.5 227.5 L440 227.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="427.5" y="169.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">unicast HA</text><path d="M605 227.5 L622.5 227.5 L622.5 355 L635 355" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="622.5" y="284.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">peer sync</text><path d="M980 341 L810 341 L810 355 L635 355" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="810" y="341" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">local ingest</text><path d="M410 125 L427.5 125 L427.5 405 L440 405" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="427.5" y="258" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">forward</text><path d="M830 355 L637.5 355 L637.5 405 L440 405" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="637.5" y="373" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">forward</text><rect x="20" y="70" width="155" height="82" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="97.5" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Site A FortiGates</text><text x="97.5" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">local log sources</text><rect x="220" y="70" width="190" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="315" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">FortiAnalyzer A</text><text x="315" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">active-active</text><text x="315" y="136" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">preferred primary</text><rect x="445" y="180" width="160" height="95" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="525" y="208" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Routed WAN</text><text x="525" y="227" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">unicast heartbeat</text><text x="525" y="246" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">VRRP proto 112</text><rect x="640" y="300" width="190" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="735" y="328" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">FortiAnalyzer B</text><text x="735" y="347" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">active-active</text><text x="735" y="366" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">peer log sync</text><rect x="850" y="300" width="130" height="82" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="915" y="328" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Site B</text><text x="915" y="347" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">FortiGates</text><rect x="445" y="365" width="160" height="80" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="525" y="393" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Remote log server</text><text x="525" y="412" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">per-member forwarding</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">No Layer-2 VIP is required across sites; initial sync and peer heartbeat must be verified.</text></svg>