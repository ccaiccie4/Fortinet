<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Secure SD-WAN — session-affine load balancing"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">Secure SD-WAN — session-affine load balancing</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Choose the hash key to preserve the egress member for the required client/session scope</text><path d="M190 220 L217.5 220 L217.5 220 L240 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="217.5" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">match</text><path d="M415 220 L445 220 L445 102.5 L470 102.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="154.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">SLA mode</text><path d="M415 220 L445 220 L445 337.5 L470 337.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="271.75" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">hash mode</text><path d="M640 102.5 L690 102.5 L690 102.5 L735 102.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="95.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">eligible</text><path d="M640 337.5 L690 337.5 L690 102.5 L735 102.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">same key</text><path d="M640 337.5 L690 337.5 L690 337.5 L735 337.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="330.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">different key</text><path d="M890 102.5 L905 102.5 L905 230 L915 230" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="159.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">session</text><path d="M890 337.5 L905 337.5 L905 230 L915 230" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="276.75" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">session</text><rect x="20" y="160" width="170" height="120" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="105" y="188" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Client flows</text><text x="105" y="207" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">same source</text><text x="105" y="226" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">multiple destinations</text><rect x="245" y="160" width="170" height="120" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="330" y="188" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">SD-WAN rule</text><text x="330" y="207" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">manual or SLA</text><text x="330" y="226" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">member set</text><rect x="475" y="55" width="165" height="95" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="557.5" y="83" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">SLA filter</text><text x="557.5" y="102" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">eligible members</text><text x="557.5" y="121" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">only</text><rect x="475" y="290" width="165" height="95" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="557.5" y="318" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Hash mode</text><text x="557.5" y="337" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">source-IP or</text><text x="557.5" y="356" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">source-dest-IP</text><rect x="740" y="55" width="150" height="95" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="815" y="83" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">WAN 1</text><text x="815" y="102" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">selected path</text><text x="815" y="121" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">stable key</text><rect x="740" y="290" width="150" height="95" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="815" y="318" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">WAN 2</text><text x="815" y="337" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">alternate path</text><text x="815" y="356" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">different key</text><rect x="920" y="170" width="65" height="120" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="952.5" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">App</text><text x="952.5" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">stable</text><text x="952.5" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">egress</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">Use source-IP for client-level stickiness or source-dest-IP for per-pair stickiness; validate actual NAT egress.</text></svg>