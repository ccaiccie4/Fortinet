<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiAP — dynamic captive-portal redirect URL"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiAP — dynamic captive-portal redirect URL</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">The portal URL is delivered in RADIUS Access-Accept attribute 27</text><path d="M170 220 L195 220 L195 220 L215 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="195" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">association / auth</text><path d="M410 220 L442.5 220 L442.5 220 L470 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="442.5" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">RADIUS request</text><path d="M665 220 L695 220 L695 220 L720 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">Fortinet-Captive-Portal-URL</text><path d="M885 220 L805 220 L805 392.5 L720 392.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="805" y="299.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">HTTP redirect</text><rect x="20" y="170" width="150" height="100" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="95" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Wireless client</text><text x="95" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">associates to</text><text x="95" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">captive SSID</text><rect x="220" y="170" width="190" height="100" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="315" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Tunnel-mode VAP</text><text x="315" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">auth-mac</text><text x="315" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">dynamic redirect</text><rect x="475" y="170" width="190" height="100" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="570" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">RADIUS policy</text><text x="570" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">Access-Accept</text><text x="570" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">attribute 27 URL</text><rect x="725" y="170" width="160" height="100" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="805" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">FortiGate WiFi</text><text x="805" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">controller</text><text x="805" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">redirect decision</text><rect x="725" y="350" width="160" height="85" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="805" y="378" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Session portal</text><text x="805" y="397" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">browser redirect</text><text x="805" y="416" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">custom URL</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">Enable captive-portal-dynamic-redirect-url on a tunnel-mode captive-portal VAP with portal-type auth-mac.</text></svg>