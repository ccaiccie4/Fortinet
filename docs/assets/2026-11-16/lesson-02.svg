<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>FortiManager: FortiGuard package version pinning and controlled downgrade semantics</title><rect width="100%" height="100%" fill="#f7fafc"/><text x="35" y="55" font-family="Arial" font-size="25" font-weight="700" fill="#12263a">FortiManager: FortiGuard package version pinning and controlled downgrade semantics</text><text x="35" y="88" font-family="Arial" font-size="14" fill="#49647f">Mechanism flow · validate each boundary independently</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36536f"/></marker></defs><path d="M225 300 L259 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M457 300 L491 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M689 300 L723 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M921 300 L955 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="35" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="130" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">Admin selects</text><text x="130" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">package version</text><rect x="267" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="362" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">FortiManager</text><text x="362" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">retains versions</text><rect x="499" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="594" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">FortiGate update</text><text x="594" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">request</text><rect x="731" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="826" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">Pinned package</text><text x="826" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">served</text><rect x="963" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="1058" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">Hold only OR</text><text x="1058" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">downgrade</text><text x="35" y="590" font-family="Arial" font-size="13" fill="#49647f">Read left to right. Upstream success does not prove downstream forwarding.</text></svg>