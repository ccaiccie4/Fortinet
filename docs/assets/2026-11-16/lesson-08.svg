<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>FortiAuthenticator: EAP-TTLS/PAP 2FA: tunneled credential flow, token carriage and challenge limitation</title><rect width="100%" height="100%" fill="#f7fafc"/><text x="35" y="55" font-family="Arial" font-size="25" font-weight="700" fill="#12263a">FortiAuthenticator: EAP-TTLS/PAP 2FA: tunneled credential flow, token carriage and challenge limitation</text><text x="35" y="88" font-family="Arial" font-size="14" fill="#49647f">Mechanism flow · validate each boundary independently</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36536f"/></marker></defs><path d="M225 300 L259 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M457 300 L491 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M689 300 L723 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M921 300 L955 300" stroke="#36536f" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="35" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="130" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">FortiClient</text><text x="130" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">EAP initiator</text><rect x="267" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="362" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">EAP-TTLS</text><text x="362" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">TLS tunnel</text><rect x="499" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="594" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">Inner PAP</text><text x="594" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">password</text><rect x="731" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="826" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">LDAP/local</text><text x="826" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">password check</text><rect x="963" y="250" width="190" height="100" rx="12" fill="#e5f0f8" stroke="#37688f" stroke-width="2"/><text x="1058" y="282" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">FortiToken 2FA</text><text x="1058" y="304" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#17354e">RADIUS result</text><text x="35" y="590" font-family="Arial" font-size="13" fill="#49647f">Read left to right. Upstream success does not prove downstream forwarding.</text></svg>