<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiNAC-F — Local RADIUS EAP-TLS revocation"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiNAC-F — Local RADIUS EAP-TLS revocation</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Local RADIUS checks OCSP from certificate AIA; CRL/CDP is not a supported path</text><path d="M180 220 L205 220 L205 220 L225 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">present cert</text><path d="M410 220 L440 220 L440 220 L465 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">AIA OCSP URL</text><path d="M650 220 L682.5 220 L682.5 220 L710 220" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="682.5" y="213" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">status response</text><path d="M180 220 L205 220 L205 390 L225 390" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="298" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">CDP only</text><path d="M410 220 L562.5 220 L562.5 390 L710 390" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="562.5" y="298" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">failover check</text><rect x="20" y="170" width="160" height="100" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="100" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">EAP-TLS client</text><text x="100" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">certificate</text><text x="100" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">AIA + CDP</text><rect x="230" y="170" width="180" height="100" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="320" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Local RADIUS</text><text x="320" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">chain validation</text><text x="320" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">RADIUS Endpoint Trust</text><rect x="470" y="170" width="180" height="100" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="560" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">OCSP responder</text><text x="560" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">good / revoked</text><text x="560" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">reachable by HA node</text><rect x="715" y="170" width="150" height="100" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="790" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Auth decision</text><text x="790" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">Access-Accept</text><text x="790" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">or Reject</text><rect x="230" y="350" width="180" height="80" rx="12" fill="#fdecec" stroke="#61758a" stroke-width="1.5"/><text x="320" y="378" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">CRL / CDP</text><text x="320" y="397" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">not used by</text><text x="320" y="416" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">Local RADIUS</text><rect x="715" y="350" width="150" height="80" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="790" y="378" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">HA peer</text><text x="790" y="397" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">trust chain +</text><text x="790" y="416" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">DNS / HTTP</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">For mandatory CRL checking, terminate EAP-TLS on a CRL-capable external RADIUS server and proxy from FortiNAC-F.</text></svg>