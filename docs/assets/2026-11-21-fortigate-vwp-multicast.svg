<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiGate — wildcard-VLAN VWP multicast session identity"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiGate — wildcard-VLAN VWP multicast session identity</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Same source/group, different VLANs → distinct multicast sessions</text><path d="M195 114 L225 114 L225 222.5 L250 222.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="161.25" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">tagged multicast</text><path d="M195 329 L225 329 L225 222.5 L250 222.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="268.75" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">tagged multicast</text><path d="M430 222.5 L460 222.5 L460 222.5 L485 222.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="215.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">policy lookup</text><path d="M665 222.5 L700 222.5 L700 117.5 L730 117.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="163" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">VLAN 50 key</text><path d="M665 222.5 L700 222.5 L700 332.5 L730 332.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="270.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">VLAN 60 key</text><rect x="25" y="70" width="170" height="88" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="110" y="98" text-anchor="mi