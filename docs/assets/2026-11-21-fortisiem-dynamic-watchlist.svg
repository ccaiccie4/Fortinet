<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiSIEM — Dynamic Watchlist using User-to-IP Lookup"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiSIEM — Dynamic Watchlist using User-to-IP Lookup</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">A username-only event can populate and maintain an IP-based watchlist</text><path d="M185 222.5 L215 222.5 L215 222.5 L240 222.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="215.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">trigger</text><path d="M415 222.5 L445 222.5 L445 122.5 L470 122.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="165.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">lookup</text><path d="M665 122.5 L570 122.5 L570 352.5 L470 352.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="230.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">resolved IP</text><path d="M665 352.5 L705 352.5 L705 222.5 L740 222.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="705" y="280.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">consume list</text><rect x="20" y="170" width="165" height="105" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="102.5" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Rule event</text><text x="102.5" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">username present</text><text x="102.5" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">IP absent</text><rect x="245" y="170" width="170" height="105" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="330" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Rule action</text><text x="330" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">LookupIpByUser</text><text x="330" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">Step 3</text><rect x="475" y="70" width="190" height="105" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="570" y="98" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Identity &amp; Location DB</text><text x="570" y="117" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">username → current IP</text><text x="570" y="136" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">mapping</text><rect x="475" y="300" width="190" height="105" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="570" y="328" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">IP Watchlist</text><text x="570" y="347" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">add / update</text><text x="570" y="366" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">remove reassigned IP</text><rect x="745" y="170" width="220" height="105" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="855" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Downstream rule</text><text x="855" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">response / remediation</text><text x="855" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">current IP</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">The lookup is only as current as the Identity and Location user-to-IP mapping.</text></svg>