<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiSASE — Source IP anchoring"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiSASE — Source IP anchoring</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Map user/group or country criteria to a dedicated public egress IP at the PoP</text><path d="M180 225 L212.5 225 L212.5 225 L240 225" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="212.5" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">tunnel</text><path d="M415 225 L450 225 L450 225 L480 225" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">match</text><path d="M665 225 L700 225 L700 225 L730 225" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">selected anchor</text><path d="M885 225 L810 225 L810 390 L730 390" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="810" y="300.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">egress</text><path d="M415 225 L330 225 L330 390 L240 390" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="300.5" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">no match</text><rect x="20" y="170" width="160" height="110" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="100" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Remote user</text><text x="100" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">FortiClient / edge</text><text x="100" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">identity + country</text><rect x="245" y="170" width="170" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="330" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Security PoP</text><text x="330" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">source criteria</text><text x="330" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">match</text><rect x="485" y="170" width="180" height="110" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="575" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Policy route</text><text x="575" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">user/group or</text><text x="575" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">country</text><rect x="735" y="170" width="150" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="810" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Firewall policy</text><text x="810" y="217" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">SNAT to anchor</text><text x="810" y="236" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">public IP</text><rect x="735" y="350" width="150" height="80" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="810" y="378" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">SaaS / private</text><text x="810" y="397" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">destination sees</text><text x="810" y="416" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">dedicated IP</text><rect x="245" y="350" width="170" height="80" rx="12" fill="#fdecec" stroke="#61758a" stroke-width="1.5"/><text x="330" y="378" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Default egress</text><text x="330" y="397" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">unanchored users</text><text x="330" y="416" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">shared/default IP</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">Source IP anchoring is backend-provisioned and license-bound; country matching is country-level, not city-level.</text></svg>