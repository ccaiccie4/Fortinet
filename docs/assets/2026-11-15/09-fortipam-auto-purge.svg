<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480" role="img"><title>Auto-provisioned user lifecycle</title><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#355b78"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><text x="40" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#17324a">Auto-provisioned user lifecycle</text><path d="M200 240 L230 240" stroke="#355b78" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="215" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#456477">activity age</text><path d="M390 240 L420 240" stroke="#355b78" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="405" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#456477">threshold reached</text><path d="M580 240 L610 240" stroke="#355b78" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="595" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#456477">second timer</text><path d="M770 240 L800 240" stroke="#355b78" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="785" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#456477">retention expires</text><rect x="40" y="190" width="160" height="100" rx="12" fill="#e4eef5" stroke="#355b78" stroke-width="2"/><text x="120" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324a"><tspan x="120" dy="0">Auto-provisioned user</tspan></text><rect x="230" y="190" width="160" height="100" rx="12" fill="#e4eef5" stroke="#355b78" stroke-width="2"/><text x="310" y="231" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324a"><tspan x="310" dy="0">Inactivity timer User</tspan><tspan x="310" dy="20">Max Inactivity Days</tspan></text><rect x="420" y="190" width="160" height="100" rx="12" fill="#e4eef5" stroke="#355b78" stroke-width="2"/><text x="500" y="231" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324a"><tspan x="500" dy="0">Disable account User</tspan><tspan x="500" dy="20">Event logged</tspan></text><rect x="610" y="190" width="160" height="100" rx="12" fill="#e4eef5" stroke="#355b78" stroke-width="2"/><text x="690" y="231" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324a"><tspan x="690" dy="0">Disabled retention</tspan><tspan x="690" dy="20">User Max Disabled Days</tspan></text><rect x="800" y="190" width="160" height="100" rx="12" fill="#e4eef5" stroke="#355b78" stroke-width="2"/><text x="880" y="231" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#17324a"><tspan x="880" dy="0">Delete user if purge</tspan><tspan x="880" dy="20">enabled</tspan></text><text x="40" y="452" font-family="Arial" font-size="12" fill="#64788a">Fortinet Enterprise Networking &amp; Security — November 15, 2026</text></svg>