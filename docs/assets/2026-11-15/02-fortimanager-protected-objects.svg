<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">FortiManager protected object permissions</title><desc id="desc">Five-stage topology illustrating fortimanager protected object permissions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker></defs><rect x="0" y="0" width="960" height="430" fill="#f7fafc"/><text x="30" y="48" font-family="Arial" font-size="22" font-weight="700" fill="#17324d">FortiManager protected object permissions</text><text x="30" y="78" font-family="Arial" font-size="13" fill="#45657f">Mechanism flow — arrows show control, data, or authorization progression</text><line x1="175" y1="210" x2="207" y2="210" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/><line x1="365" y1="210" x2="397" y2="210" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/><line x1="555" y1="210" x2="587" y2="210" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/><line x1="745" y1="210" x2="777" y2="210" stroke="#315b7d" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="160" width="150" height="100" rx="12" fill="#e8f1f7" stroke="#315b7d" stroke-width="2"/><text x="100" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Owner administrator</text><text x="100" y="209" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">Protected Objects permission</text><rect x="215" y="160" width="150" height="100" rx="12" fill="#e8f1f7" stroke="#315b7d" stroke-width="2"/><text x="290" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Global and profile</text><text x="290" y="209" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">gui-object-protect</text><text x="290" y="228" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">protected-objects</text><rect x="405" y="160" width="150" height="100" rx="12" fill="#d9eaf7" stroke="#315b7d" stroke-width="2"/><text x="480" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Protected policy/object</text><text x="480" y="209" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">Definition is guarded</text><rect x="595" y="160" width="150" height="100" rx="12" fill="#e8f1f7" stroke="#315b7d" stroke-width="2"/><text x="670" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Consumer administrator</text><text x="670" y="209" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">Read-only definition</text><rect x="785" y="160" width="150" height="100" rx="12" fill="#e8f1f7" stroke="#315b7d" stroke-width="2"/><text x="860" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#17324d">Policy package</text><text x="860" y="209" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#17324d">Object remains selectable</text><text x="30" y="315" font-family="Arial" font-size="13" fill="#45657f">Operational check: verify each boundary independently; a successful upstream stage does not prove downstream completion.</text><text x="30" y="345" font-family="Arial" font-size="12" fill="#45657f">Standalone SVG • editable source supplied as a separate draw.io file</text></svg>