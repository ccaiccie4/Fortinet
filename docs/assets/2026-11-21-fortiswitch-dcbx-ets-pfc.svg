<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiSwitch — DCBX, ETS and PFC"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiSwitch — DCBX, ETS and PFC</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Classify CoS → queue → priority group; negotiate lossless priorities with the peer</text><path d="M185 240 L210 240 L210 240 L230 240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="233" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">classification</text><path d="M400 240 L427.5 240 L427.5 130 L450 130" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="427.5" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">queue mapping</text><path d="M400 240 L427.5 240 L427.5 350 L450 350" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="427.5" y="288" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">priority mapping</text><path d="M660 130 L682.5 130 L682.5 240 L700 240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="682.5" y="178" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">advertise</text><path d="M660 350 L682.5 350 L682.5 240 L700 240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="682.5" y="288" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">PFC config</text><path d="M850 240 L865 240 L865 240 L875 240" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="233" text-anchor="middle" font-family="Arial" font-size="11"