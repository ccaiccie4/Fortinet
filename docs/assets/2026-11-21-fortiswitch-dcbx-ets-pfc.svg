ze="12" font-weight="400" fill="#1d2a39">priority only</text><rect x="705" y="185" width="145" height="110" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="777.5" y="213" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">LLDP / DCBX</text><text x="777.5" y="232" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">ETS · PFC · app</text><text x="777.5" y="251" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">priority TLVs</text><rect x="880" y="185" width="100" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="930" y="213" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Peer</text><text x="930" y="232" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">same DCBX</text><text x="930" y="251" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">contract</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">Supported models only. DCBX uses Dot1p trust; ETS priority-group rates must total 100%.</text></svg>