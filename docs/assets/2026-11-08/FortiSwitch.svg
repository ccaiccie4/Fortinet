<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title>Dual-signed image verification</title><desc>File transfer is not the same as firmware trust validation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><text x="35" y="34" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18324b">Dual-signed image verification</text><text x="35" y="58" font-family="Arial,sans-serif" font-size="13" fill="#52677f">File transfer is not the same as firmware trust validation.</text><line x1="125" y1="300" x2="395" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="260" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">stage firmware</text><line x1="395" y1="300" x2="670" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="532.5" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">validate</text><line x1="670" y1="300" x2="925" y2="105" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="797.5" y="194.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">check capability</text><line x1="925" y1="105" x2="1075" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1000" y="194.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">supported + trusted</text><line x1="670" y1="300" x2="925" y2="495" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="797.5" y="389.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">signature fails</text><line x1="925" y1="105" x2="925" y2="495" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="925" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">BIOS unsupported</text><rect x="30" y="250" width="190" height="100" rx="14" fill="#e8f1fb" stroke="#486581" stroke-width="2.5"/><text x="125" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="125" dy="0">FortiGate</tspan><tspan x="125" dy="18">switch controller</tspan></text><rect x="300" y="250" width="190" height="100" rx="14" fill="#e8f1fb" stroke="#486581" stroke-width="2.5"/><text x="395" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="395" dy="0">Approved image</tspan><tspan x="395" dy="18">intake</tspan></text><rect x="565" y="250" width="210" height="100" rx="14" fill="#fff3d6" stroke="#9a6a00" stroke-width="2.5"/><text x="670" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="670" dy="0">Signature and</tspan><tspan x="670" dy="18">integrity check</tspan></text><rect x="820" y="55" width="210" height="100" rx="14" fill="#e8f1fb" stroke="#486581" stroke-width="2.5"/><text x="925" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="925" dy="0">Model / BIOS</tspan><tspan x="925" dy="18">verification support</tspan></text><rect x="980" y="250" width="190" height="100" rx="14" fill="#e4f5e9" stroke="#28704a" stroke-width="2.5"/><text x="1075" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="1075" dy="0">Install image</tspan><tspan x="1075" dy="18">and reboot</tspan></text><rect x="820" y="445" width="210" height="100" rx="14" fill="#fff3d6" stroke="#9a6a00" stroke-width="2.5"/><text x="925" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="925" dy="0">Stop and investigate</tspan><tspan x="925" dy="18">unverified warning</tspan></text><text x="35" y="620" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Fortinet Enterprise Networking &amp; Security • 2026-11-08 • Mechanism-level diagram</text></svg>