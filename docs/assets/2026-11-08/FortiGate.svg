<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title>Transparent conditional DNS forwarding</title><desc>QNAME zone match selects local answer, zone forwarder, or original resolver.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><text x="35" y="34" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18324b">Transparent conditional DNS forwarding</text><text x="35" y="58" font-family="Arial,sans-serif" font-size="13" fill="#52677f">QNAME zone match selects local answer, zone forwarder, or original resolver.</text><line x1="125" y1="295" x2="390" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="257.5" y="289.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">UDP/TCP 53</text><line x1="390" y1="300" x2="665" y2="305" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="527.5" y="294.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">inspect QNAME</text><line x1="665" y1="305" x2="990" y2="100" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="827.5" y="194.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">local record exists</text><line x1="665" y1="305" x2="990" y2="290" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="827.5" y="289.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">zone match; no local answer</text><line x1="665" y1="305" x2="990" y2="480" stroke="#52677f