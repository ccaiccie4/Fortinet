<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>FortiLink credential planes</title><desc>REST API, SSH/CLI, SNMPv3 and RADIUS are independent channels.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><text x="35" y="34" font-family="Arial" font-size="23" font-weight="700" fill="#18324b">FortiLink credential planes</text><text x="35" y="58" font-family="Arial" font-size="13" fill="#52677f">REST API, SSH/CLI, SNMPv3 and RADIUS are independent channels.</text><line x1="120" y1="300" x2="405" y2="85" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="262.5" y="184.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">token</text><line x1="120" y1="300" x2="405" y2="235" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="262.5" y="259.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">SSH</text><line x1="120" y1="300" x2="405" y2="385" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="262.5" y="334.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">SNMPv3</text><line x1="120" y1="300" x2="405" y2="535" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="262.5" y="409.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">RADIUS</text><line x1="405" y1="85" x2="755" y2="240" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="580" y="154.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke"