<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title>Per-policy workspace locking</title><desc>Individual policy ownership and policy-sequence ownership are separate lock scopes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><text x="35" y="34" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18324b">Per-policy workspace locking</text><text x="35" y="58" font-family="Arial,sans-serif" font-size="13" fill="#52677f">Individual policy ownership and policy-sequence ownership are separate lock scopes.</text><line x1="135" y1="125" x2="470" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="302.5" y="204.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">edit P</text><line x1="470" y1="300" x2="785" y2="140" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="627.5" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">lock P</text><line x1="135" y1="465" x2="470" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="302.5" y="374.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">other policy</text><line x1="470" y1="300" x2="785" y2="450" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="627.5" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">add / reorder</text><line x1="470" y1="300" x2="1070" y2="300" stroke="#52677f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="770" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">block membership</text><line x1="785" y1="140" x2="135" y2="125" stroke="#52677f" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="460" y="124.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">save / release</text><line x1="785" y1="450" x2="135" y2="465" stroke="#52677f" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="460" y="449.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334e68" stroke="#f7fafc" stroke-width="4" paint-order="stroke">order protected</text><rect x="30" y="80" width="210" height="90" rx="14" fill="#e4f5e9" stroke="#28704a" stroke-width="2.5"/><text x="135" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="135" dy="0">Administrator A</tspan><tspan x="135" dy="18">locks policy P</tspan></text><rect x="30" y="420" width="210" height="90" rx="14" fill="#e8f1fb" stroke="#486581" stroke-width="2.5"/><text x="135" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="135" dy="0">Administrator B</tspan><tspan x="135" dy="18">edits other rules</tspan></text><rect x="360" y="245" width="220" height="110" rx="14" fill="#e8f1fb" stroke="#486581" stroke-width="2.5"/><text x="470" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324d"><tspan x="470" dy="0">Shared ADOM</tspan><tspan x="470" dy="18">policy package</tspan></text><rect x="680" y="90" width="210" height="100" rx="14" fill="#e4f5e9" stroke="#28704a" stroke-width="2.5"/><text x="785" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#1