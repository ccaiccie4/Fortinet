<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="FortiPAM — reusable Guest Instruction Profiles"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526477"/></marker></defs><rect width="1000" height="500" fill="#fbfcfe"/><text x="28" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#182434">FortiPAM — reusable Guest Instruction Profiles</text><text x="28" y="58" font-family="Arial" font-size="13" fill="#536477">Guidance and media are separate objects from secret credentials and access control</text><path d="M210 135 L247.5 135 L247.5 135 L280 135" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="247.5" y="128" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">insert media</text><path d="M475 375 L380 375 L380 135 L280 135" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="248" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">enable</text><path d="M475 135 L522.5 135 L522.5 92.5 L565 92.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="522.5" y="106.75" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">attach</text><path d="M475 135 L522.5 135 L522.5 252.5 L565 252.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="522.5" y="186.75" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">attach</text><path d="M725 92.5 L770 92.5 L770 177.5 L810 177.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="128" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">checkout</text><path d="M725 252.5 L770 252.5 L770 177.5 L810 177.5" fill="none" stroke="#526477" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#405368">checkout</text><rect x="20" y="80" width="190" height="110" rx="12" fill="#e8f1ff" stroke="#61758a" stroke-width="1.5"/><text x="115" y="108" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Instruction resources</text><text x="115" y="127" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">images / video</text><text x="115" y="146" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">allocation &gt; 0</text><rect x="285" y="80" width="190" height="110" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="380" y="108" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Instruction profile</text><text x="380" y="127" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">formatted guidance</text><text x="380" y="146" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">reusable object</text><rect x="570" y="45" width="155" height="95" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="647.5" y="73" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Secret A</text><text x="647.5" y="92" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">Guest Instruction</text><text x="647.5" y="111" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">profile reference</text><rect x="570" y="205" width="155" height="95" rx="12" fill="#fff3df" stroke="#61758a" stroke-width="1.5"/><text x="647.5" y="233" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Secret B</text><text x="647.5" y="252" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">same profile</text><text x="647.5" y="271" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">reference</text><rect x="815" y="120" width="170" height="115" rx="12" fill="#eaf7ef" stroke="#61758a" stroke-width="1.5"/><text x="900" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Guest checkout</text><text x="900" y="167" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">secret is authorized</text><text x="900" y="186" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">instructions render</text><rect x="285" y="335" width="190" height="80" rx="12" fill="#f0f2f5" stroke="#61758a" stroke-width="1.5"/><text x="380" y="363" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d2a39">Advanced settings</text><text x="380" y="382" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">feature toggle</text><text x="380" y="401" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#1d2a39">resource quota</text><line x1="28" y1="455" x2="972" y2="455" stroke="#d4dce5"/><text x="28" y="478" font-family="Arial" font-size="12" fill="#536477">A profile does not grant secret access; it supplies contextual instructions after the guest is authorized to check out.</text></svg>