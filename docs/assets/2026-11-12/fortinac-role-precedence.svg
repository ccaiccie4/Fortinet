-serif" font-size="11" font-weight="700" fill="#fff">5</text><text x="997.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">Network access</text><text x="997.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">policy</text><text x="28" y="350" font-family="Arial,sans-serif" font-size="12" fill="#475569">Interpret each stage independently: configuration presence does not prove transaction success at the next boundary.</text><text x="28" y="382" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Source: Fortinet administration/configuration documentation linked in the daily report.</text></svg>