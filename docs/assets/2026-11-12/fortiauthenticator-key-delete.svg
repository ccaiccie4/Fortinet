<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">FortiAuthenticator one-time private-key delivery</title><desc id="desc">Mechanism flow with 5 stages.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">FortiAuthenticator one-time private-key delivery</text><text x="28" y="80" font-family="Arial,sans-serif" font-size="13" fill="#475569">Fortinet feature mechanics — sequence and control/data boundaries</text><line x1="212" y1="206" x2="237" y2="206" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/><text x="227.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">issue certificate</text><rect x="25" y="150" width="185" height="112" rx="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="45" cy="170" r="12" fill="#0369a1"/><text x="45" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text><text x="117.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">FAC CA / user</text><text x="117.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">certificate</text><line x1="432" y1="206" x2="457" y2="206" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/><text x="447.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">package key + cert</text><rect x="245" y="150" width="185" height="112" rx="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="265" cy="170" r="12" fill="#0369a1"/><text x="265" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">2</text><text x="337.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">Generated private</text><text x="337.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">key</text><line x1="652" y1="206" x2="677" y2="206" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/><text x="667.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">delete server copy</text><rect x="465" y="150" width="185" height="112" rx="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="485" cy="170" r="12" fill="#0369a1"/><text x="485" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">3</text><text x="557.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">PKCS#12 Export Key</text><text x="557.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">Cert</text><line x1="872" y1="206" x2="897" y2="206" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/><text x="887.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">endpoint retains key</text><rect x="685" y="150" width="185" height="112" rx="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="705" cy="170" r="12" fill="#0369a1"/><text x="705" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">4</text><text x="777.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">Conditional</text><text x="777.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">server-key deletion</text><rect x="905" y="150" width="185" height="112" rx="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="925" cy="170" r="12" fill="#0369a1"/><text x="925" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">5</text><text x="997.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">Endpoint certificate</text><text x="997.5" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">store</text><text x="28" y="350" font-family="Arial,sans-serif" font-size="12" fill="#475569">Interpret each stage independently: configuration presence does not prove transaction success at the next boundary.</text><text x="28" y="382" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Source: Fortinet administration/configuration documentation linked in the daily report.</text></svg>