<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" role="img" aria-labelledby="t9 d9"><title id="t9">ZTNA-protected FortiPAM REST API: endpoint trust, EMS tags, and bearer-token identity</title><desc id="d9">endpoint-to-EMS control plane plus endpoint-to-FortiPAM mTLS/API data path with separate identity gates</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#486178"/></marker></defs><rect width="1160" height="320" rx="14" fill="#fff" stroke="#d4e0ea"/><text x="20" y="34" font-size="16" font-weight="700" fill="#183247">FortiPAM — feature flow</text><line x1="280" y1="124.5" x2="300" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><line x1="565" y1="124.5" x2="585" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><line x1="850" y1="124.5" x2="870" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><g><rect x="20" y="72" width="260" height="105" rx="12" fill="#e7f1ff" stroke="#486178" stroke-width="1.6"/><text x="150" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 1</text><text x="150" y="118" text-anchor="middle" font-size="12" fill="#183247">FortiClient endpoint</text></g><g><rect x="305" y="72" width="260" height="105" rx="12" fill="#f4f7fa" stroke="#486178" stroke-width="1.6"/><text x="435" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 2</text><text x="435" y="118" text-anchor="middle" font-size="12" fill="#183247">EMS posture/tag</text></g><g><rect x="590" y="72" width="260" height="105" rx="12" fill="#f4f7fa" stroke="#486178" stroke-width="1.6"/><text x="720" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 3</text><text x="720" y="118" text-anchor="middle" font-size="12" fill="#183247">access proxy validates client</text><text x="720" y="135" text-anchor="middle" font-size="12" fill="#183247">certificate</text></g><g><rect x="875" y="72" width="260" height="105" rx="12" fill="#e8f5eb" stroke="#486178" stroke-width="1.6"/><text x="1005" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 4</text><text x="1005" y="118" text-anchor="middle" font-size="12" fill="#183247">access-proxy policy → /pam</text><text x="1005" y="135" text-anchor="middle" font-size="12" fill="#183247">API gateway → bearer</text><text x="1005" y="152" text-anchor="middle" font-size="12" fill="#183247">identity and secret-level authorization</text></g><rect x="20" y="204" width="1120" height="94" rx="10" fill="#f7fafc" stroke="#d4e0ea"/><text x="38" y="229" font-size="12" font-weight="700" fill="#183247">Diagnostic boundary / topology</text><text x="38" y="254" font-size="12" fill="#29465e">fortipam-ztna-access-proxy-client-cert-ems-tag-api-bearer-token</text><text x="38" y="278" font-size="11" fill="#60758a">endpoint-to-EMS control plane plus endpoint-to-FortiPAM mTLS/API data path with separate identity gates</text></svg>