<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" role="img" aria-labelledby="t4 d4"><title id="t4">VRRP destination-route tracking: fail over when the gateway is alive but upstream reachability is lost</title><desc id="d4">two switches share VIP/VMAC; tracked upstream destination drives priority reduction and role transition</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#486178"/></marker></defs><rect width="1160" height="320" rx="14" fill="#fff" stroke="#d4e0ea"/><text x="20" y="34" font-size="16" font-weight="700" fill="#183247">FortiSwitch — feature flow</text><line x1="280" y1="124.5" x2="300" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><line x1="565" y1="124.5" x2="585" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><line x1="850" y1="124.5" x2="870" y2="124.5" stroke="#486178" stroke-width="2" marker-end="url(#arr)"/><g><rect x="20" y="72" width="260" height="105" rx="12" fill="#e7f1ff" stroke="#486178" stroke-width="1.6"/><text x="150" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 1</text><text x="150" y="118" text-anchor="middle" font-size="12" fill="#183247">VRRP Master advertises VIP/VMAC</text></g><g><rect x="305" y="72" width="260" height="105" rx="12" fill="#f4f7fa" stroke="#486178" stroke-width="1.6"/><text x="435" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 2</text><text x="435" y="118" text-anchor="middle" font-size="12" fill="#183247">route to tracked destination</text><text x="435" y="135" text-anchor="middle" font-size="12" fill="#183247">evaluated</text></g><g><rect x="590" y="72" width="260" height="105" rx="12" fill="#f4f7fa" stroke="#486178" stroke-width="1.6"/><text x="720" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 3</text><text x="720" y="118" text-anchor="middle" font-size="12" fill="#183247">loss changes priority to</text><text x="720" y="135" text-anchor="middle" font-size="12" fill="#183247">zero</text></g><g><rect x="875" y="72" width="260" height="105" rx="12" fill="#e8f5eb" stroke="#486178" stroke-width="1.6"/><text x="1005" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#183247">Stage 4</text><text x="1005" y="118" text-anchor="middle" font-size="12" fill="#183247">Backup becomes Master →</text><text x="1005" y="135" text-anchor="middle" font-size="12" fill="#183247">forwarding moves to shared</text><text x="1005" y="152" text-anchor="middle" font-size="12" fill="#183247">VMAC</text></g><rect x="20" y="204" width="1120" height="94" rx="10" fill="#f7fafc" stroke="#d4e0ea"/><text x="38" y="229" font-size="12" font-weight="700" fill="#183247">Diagnostic boundary / topology</text><text x="38" y="254" font-size="12" fill="#29465e">fortiswitch-vrrp-vrdst-route-reachability-priority-zero-vmac</text><text x="38" y="278" font-size="11" fill="#60758a">two switches share VIP/VMAC; tracked upstream destination drives priority reduction and role transition</text></svg>