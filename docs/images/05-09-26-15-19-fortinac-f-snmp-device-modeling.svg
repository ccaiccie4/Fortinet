<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#334155"/></marker></defs><rect width="1400" height="720" fill="#f8fafc"/><rect width="1400" height="76" fill="#083344"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="700">FortiNAC-F — SNMP device modeling and control capability</text><g font-family="Arial" font-size="16" font-weight="700" fill="white"><rect x="70" y="180" width="220" height="95" rx="16" fill="#0ea5e9"/><text x="90" y="215">1 FortiNAC-F</text><text x="90" y="242" font-size="14">inventory engine</text><rect x="70" y="380" width="220" height="95" rx="16" fill="#8b5cf6"/><text x="90" y="415">2 IP path</text><text x="90" y="442" font-size="14">ping only</text><rect x="400" y="180" width="220" height="95" rx="16" fill="#f59e0b"/><text x="420" y="215">3 UDP / 161</text><text x="420" y="242" font-size="14">SNMP transport</text><rect x="400" y="380" width="220" height="95" rx="16" fill="#ef4444"/><text x="420" y="415">4 Credentials</text><text x="420" y="442" font-size="14">v2c / v3 auth</text><rect x="730" y="180" width="220" height="95" rx="16" fill="#ec4899"/><text x="750" y="215">5 sysObjectID</text><text x="750" y="242" font-size="14">device identity</text><rect x="730" y="380" width="220" height="95" rx="16" fill="#14b8a6"/><text x="750" y="415">6 Model mapping</text><text x="750" y="442" font-size="14">supported plugin</text><rect x="1060" y="180" width="220" height="95" rx="16" fill="#22c55e"/><text x="1080" y="215">7 Interface tables</text><text x="1080" y="242" font-size="14">topology / ports</text><rect x="1060" y="380" width="220" height="95" rx="16" fill="#6366f1"/><text x="1080" y="415">8 Control method</text><text x="1080" y="442" font-size="14">VLAN / port action</text></g><g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M180 275V380"/><path d="M290 428H370V228H400"/><path d="M510 275V380"/><path d="M620 428H700V228H730"/><path d="M840 275V380"/><path d="M950 428H1030V228H1060"/><path d="M1170 275V380"/></g><rect x="45" y="555" width="1310" height="110" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="70" y="588" font-family="Arial" font-size="18" font-weight="700" fill="#0e7490">Four proofs, not one</text><text x="70" y="620" font-family="Arial" font-size="15" fill="#334155">Ping proves IP reachability; SNMP proves management transport/auth; sysObjectID proves identity; plugin support proves control capability.</text><text x="70" y="647" font-family="Arial" font-size="15" fill="#334155">Troubleshoot in that order instead of treating “reachable” as a complete device-modeling result.</text></svg>