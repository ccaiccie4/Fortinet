<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330"><defs><linearGradient id="g"><stop stop-color="#0b4f8a"/><stop offset="1" stop-color="#7a297a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#40566c"/></marker><filter id="s"><feDropShadow dy="3" stdDeviation="3" flood-opacity=".2"/></filter></defs><rect width="1180" height="330" fill="#f8fafc"/><rect width="1180" height="44" fill="url(#g)"/><text x="22" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="white">FortiGate IPsec Aggregate — Policy, Route, Member Selection, and Encrypted Forwarding</text><g opacity=".9"><rect y="44" width="280" height="236" fill="#e6f2ff"/><rect x="280" y="44" width="350" height="236" fill="#fff0e8"/><rect x="630" y="44" width="300" height="236" fill="#ecf9ee"/><rect x="930" y="44" width="250" height="236" fill="#f4edff"/></g><g font-family="system-ui" font-size="13" font-weight="700" fill="#334155"><text x="12" y="65">Branch LAN</text><text x="292" y="65">FortiGate datapath</text><text x="642" y="65">Encrypted underlays</text><text x="942" y="65">Remote site</text></g><g fill="none" stroke="#40566c" stroke-width="2.2" marker-end="url(#a)"><path d="M185 145H315"/><path d="M390 120V170"/><path d="M465 202C500 202 500 139 535 139"/><path d="M620 139C665 139 665 87 710 87"/><path d="M620 139C665 139 665 207 710 207"/><path d="M870 87C925 87 925 145 980 145"/><path d="M870 207C925 207 925 145 980 145"/></g><g filter="url(#s)" stroke="#315a7d" stroke-width="1.7"><rect x="40" y="115" width="145" height="60" rx="12" fill="#cfe6ff"/><rect x="315" y="88" width="150" height="64" rx="12" fill="#ffd7bf"/><rect x="315" y="170" width="150" height="64" rx="12" fill="#ffc9a8"/><rect x="535" y="98" width="170" height="82" rx="12" fill="#ffb887"/><rect x="710" y="54" width="160" height="66" rx="12" fill="#d8f1dd"/><rect x="710" y="174" width="160" height="66" rx="12" fill="#d8f1dd"/><rect x="980" y="110" width="165" height="70" rx="12" fill="#e5d9ff"/></g><g font-family="system-ui" font-size="13" text-anchor="middle" fill="#17324d"><text x="112" y="143" font-weight="700">Branch client</text><text x="112" y="161">10.10.10.25</text><text x="390" y="115" font-weight="700">Firewall policy</text><text x="390" y="134">egress = aggregate</text><text x="390" y="197" font-weight="700">Route lookup</text><text x="390" y="216">next hop = agg-ipsec</text><text x="620" y="126" font-weight="700">Aggregate selector</text><text x="620" y="145">RR · L3 · L4 · WRR</text><text x="620" y="163">or redundant mode</text><text x="790" y="82" font-weight="700">IPsec member 1</text><text x="790" y="101">ISP-A · IKE/ESP</text><text x="790" y="202" font-weight="700">IPsec member 2</text><text x="790" y="221">ISP-B · IKE/ESP</text><text x="1062" y="138" font-weight="700">Remote FortiGate</text><text x="1062" y="157">protected subnet</text></g><rect y="280" width="1180" height="50" fill="#edf2f7"/><g font-family="system-ui" font-size="11.5" fill="#243746"><text x="20" y="309">● Members negotiate independently</text><text x="365" y="309">● Aggregate selects per flow, not per packet</text><text x="785" y="309">● IKE-up alone does not prove aggregate forwarding</text></g></svg>