<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330"><defs><linearGradient id="g"><stop stop-color="#0284c7"/><stop offset="1" stop-color="#16a34a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#40566c"/></marker></defs><rect width="1180" height="330" fill="#f8fafc"/><rect width="1180" height="44" fill="url(#g)"/><text x="22" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="white">FortiSASE Digital Experience Monitoring — Endpoint, First Mile, PoP, and Application Segments</text><rect y="44" width="270" height="236" fill="#e8f3ff"/><rect x="270" y="44" width="260" height="236" fill="#fff0e8"/><rect x="530" y="44" width="300" height="236" fill="#fff9dc"/><rect x="830" y="44" width="350" height="236" fill="#e9f8ef"/><g font-family="system-ui" font-size="13" font-weight="700"><text x="12" y="65">Endpoint</text><text x="282" y="65">First mile / ISP</text><text x="542" y="65">FortiSASE PoP</text><text x="842" y="65">SaaS / Private App</text></g><g stroke="#40566c" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M190 145H300"/><path d="M455 145H565"/><path d="M735 145C775 145 775 95 815 95"/><path d="M735 145C775 145 775 205 815 205"/><path d="M980 95C1020 95 1020 145 1060 145"/><path d="M980 205C1020 205 1020 145 1060 145"/></g><g stroke="#315a7d" stroke-width="1.7"><rect x="35" y="110" width="155" height="70" rx="12" fill="#cfe5ff"/><rect x="300" y="110" width="155" height="70" rx="12" fill="#ffd4bb"/><rect x="565" y="110" width="170" height="70" rx="12" fill="#fff09a"/><rect x="815" y="65" width="165" height="60" rx="12" fill="#ffe070"/><rect x="815" y="175" width="165" height="60" rx="12" fill="#d9f0ff"/><rect x="1060" y="110" width="105" height="70" rx="12" fill="#c5e8ce"/></g><g font-family="system-ui" font-size="13" text-anchor="middle" fill="#17324d"><text x="112" y="138" font-weight="700">DEM endpoint</text><text x="112" y="157">CPU · memory · Wi-Fi</text><text x="377" y="138" font-weight="700">First-mile path</text><text x="377" y="157">RTT · loss · ISP hops</text><text x="650" y="138" font-weight="700">Security PoP</text><text x="650" y="157">tunnel + service processing</text><text x="897" y="92" font-weight="700">Endpoint trace</text><text x="897" y="110">hop-by-hop path</text><text x="897" y="202" font-weight="700">PoP → SaaS health</text><text x="897" y="220">service metrics</text><text x="1112" y="138" font-weight="700">User</text><text x="1112" y="157">transaction</text></g><rect y="280" width="1180" height="50" fill="#edf2f7"/><g font-family="system-ui" font-size="11.5"><text x="20" y="309">● Endpoint health and path health are separate</text><text x="390" y="309">● First-mile degradation can exist while PoP→SaaS is healthy</text><text x="830" y="309">● Non-responsive intermediate hops do not alone prove loss</text></g></svg>