<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330"><defs><linearGradient id="g"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#059669"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#40566c"/></marker></defs><rect width="1180" height="330" fill="#f8fafc"/><rect width="1180" height="44" fill="url(#g)"/><text x="22" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="white">FortiSwitch Private VLAN — Primary, Isolated, Community, and Promiscuous Forwarding</text><rect y="44" width="370" height="236" fill="#fff3e7"/><rect x="370" y="44" width="390" height="236" fill="#e8f3ff"/><rect x="760" y="44" width="420" height="236" fill="#eaf8ef"/><g font-family="system-ui" font-size="13" font-weight="700"><text x="12" y="65">Secondary VLANs</text><text x="382" y="65">Primary VLAN domain</text><text x="772" y="65">Promiscuous/shared services</text></g><g stroke="#40566c" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M210 100C320 100 320 145 430 145"/><path d="M210 220C320 220 320 145 430 145"/><path d="M365 100C397 100 397 145 430 145"/><path d="M365 220C397 220 397 145 430 145"/><path d="M595 145H835"/><path d="M275 100V220" stroke="#10b981" stroke-dasharray="6 4"/></g><g stroke="#315a7d" stroke-width="1.7"><rect x="45" y="70" width="165" height="60" rx="12" fill="#ffd8bb"/><rect x="45" y="190" width="165" height="60" rx="12" fill="#ffd8bb"/><rect x="215" y="70" width="150" height="60" rx="12" fill="#ffebb9"/><rect x="215" y="190" width="150" height="60" rx="12" fill="#ffebb9"/><rect x="430" y="110" width="165" height="70" rx="12" fill="#cfe5ff"/><rect x="835" y="108" width="190" height="74" rx="12" fill="#c9edd4"/></g><g font-family="system-ui" font-size="13" text-anchor="middle" fill="#17324d"><text x="127" y="98" font-weight="700">Isolated host A</text><text x="127" y="116">secondary 101</text><text x="127" y="218" font-weight="700">Isolated host B</text><text x="127" y="236">secondary 101</text><text x="290" y="98" font-weight="700">Community A</text><text x="290" y="116">secondary 102</text><text x="290" y="218" font-weight="700">Community B</text><text x="290" y="236">secondary 102</text><text x="512" y="138" font-weight="700">Primary VLAN 100</text><text x="512" y="157">PVLAN domain</text><text x="930" y="137" font-weight="700">Gateway / shared service</text><text x="930" y="156">promiscuous port</text></g><rect y="280" width="1180" height="50" fill="#edf2f7"/><g font-family="system-ui" font-size="11.5"><text x="20" y="309">● Isolated peers cannot bridge to each other</text><text x="390" y="309">● Community peers can communicate within their community</text><text x="810" y="309">● All permitted secondary traffic reaches promiscuous services through the primary domain</text></g></svg>