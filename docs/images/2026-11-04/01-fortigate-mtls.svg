<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">FortiGate mTLS external feed</title><desc id="desc">Technical flow diagram for FortiGate mTLS external feed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#577895"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="42" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16334f">FortiGate mTLS external feed</text><path d="M 165 264 L 445 264" fill="none" stroke="#577895" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="255" text-anchor="middle" font-size="14" fill="#526b83">local-out fetch</text><path d="M 445 264 L 755 134" fill="none" stroke="#577895" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="190" text-anchor="middle" font-size="14" fill="#526b83">select certificate</text><path d="M 755 134 L 1045 264" fill="none" stroke="#577895" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="190" text-anchor="middle" font-size="14" fill="#526b83">Certificate + proof</text><path d="M 1045 264 L 755 404" fill="none" stroke="#577895" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="325" text-anchor="middle" font-size="14" fill="#526b83">HTTPS feed response</text><g><rect x="70" y="220" width="190" height="88" rx="14" fill="#eaf3ff" stroke="#3d6f9e" stroke-width="2"/><text x="165" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="165" dy="0">Local-traffic VDOM</tspan></text></g><g><rect x="340" y="220" width="210" height="88" rx="14" fill="#eaf3ff" stroke="#3d6f9e" stroke-width="2"/><text x="445" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="445" dy="0">External-resource object</tspa