<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1040 330" width="1040" height="330"><title id="title">RadSec for WPA2/WPA3-Enterprise: RADIUS-over-TLS transport and certificate trust</title><desc id="desc">Five-stage feature flow with an operational diagnostic boundary.</desc><rect width="100%" height="100%" rx="14" fill="#f4f8fb"/><rect x="24" y="60" width="176" height="100" rx="12" fill="#d9ebf8" stroke="#28445c" stroke-width="2"/><text x="112" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#13283b"><tspan x="112" dy="0">Wi-Fi client</tspan><tspan x="112" dy="21">EAP exchange</tspan></text><line x1="203" y1="110" x2="224" y2="110" stroke="#4b6b84" stroke-width="3"/><polygon points="224,110 215,104 215,116" fill="#4b6b84"/><rect x="230" y="60" width="176" height="100" rx="12" fill="#e8e3fb" stroke="#28445c" stroke-width="2"/><text x="318" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#13283b"><tspan x="318" dy="0">FortiAP / Wi-Fi</tspan><tspan x="318" dy="21">controller</tspan></text><line x1="409" y1="110" x2="430" y2="110" stroke="#4b6b84" stroke-width="3"/><polygon points="430,110 421,104 421,116" fill="#4b6b84"/><rect x="436" y="60" width="176" height="100" rx="12" fill="#d9f2e4" stroke="#28445c" stroke-width="2"/><text x="524" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#13283b"><tspan x="524" dy="0">RadSec client</tspan><tspan x="524" dy="21">TCP + TLS</tspan></text><line x1="615" y1="110" x2="636" y2="110" stroke="#4b6b84" stroke-width="3"/><polygon points="636,110 627,104 627,116" fill="#4b6b84"/><rect x="642" y="60" width="176" height="100" rx="12" fill="#fff0d1" stroke="#28445c" stroke-width="2"/><text x="730" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#13283b"><tspan x="730" dy="0">RADIUS server</tspan><tspan x="730" dy="21">cert + policy</tspan></text><line x1="821" y1="110" x2="842" y2="110" stroke="#4b6b84" stroke-width="3"/><polygon points="842,110 833,104 833,116" fill="#4b6b84"/><rect x="848" y="60" width="176" height="100" rx="12" fill="#f7dfe3" stroke="#28445c" stroke-width="2"/><text x="936" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#13283b"><tspan x="936" dy="0">Access-Accept</tspan><tspan x="936" dy="21">VLAN / DHCP</tspan></text><rect x="24" y="205" width="992" height="82" rx="10" fill="#fff7e5" stroke="#b78732" stroke-width="2"/><text x="44" y="238" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#513d16">Operational boundary</text><text x="44" y="263" font-family="Arial,sans-serif" font-size="15" fill="#513d16">Association success is not proof that RADIUS authorization succeeded.</text></svg>