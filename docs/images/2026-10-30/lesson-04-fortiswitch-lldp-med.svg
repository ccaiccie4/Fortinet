<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">LLDP-MED voice VLAN</title><desc id="desc">Advertised VLAN works only if endpoint accepts it and the VLAN is carried.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#465b70"/></marker></defs><rect width="1120" height="290" rx="12" fill="#ffffff" stroke="#d7e0e8"/><text x="24" y="28" font-size="17" font-weight="700" fill="#20364a">FortiSwitch — LLDP-MED voice VLAN</text><line x1="208" y1="98" x2="238" y2="98" stroke="#465b70" stroke-width="2" marker-end="url(#arrow)"/><line x1="428" y1="98" x2="458" y2="98" stroke="#465b70" stroke-width="2" marker-end="url(#arrow)"/><line x1="648" y1="98" x2="678" y2="98" stroke="#465b70" stroke-width="2" marker-end="url(#arrow)"/><line x1="868" y1="98" x2="898" y2="98" stroke="#465b70" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="24" y="60" width="184" height="76" rx="10" fill="#e8f2ff" stroke="#52677b" stroke-width="1.6"/><text x="116" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#20364a">Phone</text><text x="116" y="109" text-anchor="middle" font-size="11" fill="#334e68">LLDP receive</text></g><g><rect x="244" y="60" width="184" height="76" rx="10" fill="#f5f7fa" stroke="#52677b" stroke-width="1.6"/><text x="336" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#20364a">LLDP-MED TLV</text><text x="336" y="109" text-anchor="middle" font-size="11" fill="#334e68">voice VLAN + QoS</text></g><g><rect x="464" y="60" width="184" height="76" rx="10" fill="#f5f7fa" stroke="#52677b" stroke-width="1.6"/><text x="556" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#20364a">Switch port</text><text x="556" y="109" text-anchor="middle" font-size="11" fill="#334e68">profile + VLAN allow</text></g><g><rect x="684" y="60" width="184" height="76" rx="10" fill="#f5f7fa" stroke="#52677b" stroke-width="1.6"/><text x="776" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#20364a">Voice VLAN</text><text x="776" y="109" text-anchor="middle" font-size="11" fill="#334e68">tagged forwarding</text></g><g><rect x="904" y="60" width="184" height="76" rx="10" fill="#e5f5e9" stroke="#52677b" stroke-width="1.6"/><text x="996" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#20364a">DHCP / QoS</text><text x="996" y="109" text-anchor="middle" font-size="11" fill="#334e68">lease + queues</text></g><rect x="24" y="166" width="1072" height="90" rx="8" fill="#f8fafc" stroke="#d7e0e8"/><text x="40" y="190" font-size="12" font-weight="700" fill="#20364a">Decision / verification boundary</text><text x="40" y="214" font-size="13" fill="#334e68">Advertised VLAN works only if endpoint accepts it and the VLAN is carried.</text><text x="40" y="238" font-size="11" fill="#60758a">Use the evidence at each stage; success in one stage does not prove the next stage completed.</text></svg>