<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img"><title>FortiSIEM — Windows WMI/OMI monitoring: WinRM transport and event evidence</title><desc>Four-stage mechanism flow and failure boundary.</desc><defs><marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8cc8ff"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b1726"/><text x="28" y="34" fill="#f5c86b" font-family="Arial" font-size="18" font-weight="700">FortiSIEM · mechanism map</text><rect x="28" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="130.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="130.5" dy="0">FortiSIEM</tspan><tspan x="130.5" dy="21">Supervisor/Collector</tspan></text><line x1="236" y1="140" x2="264" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a9)"/><rect x="272" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="374.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="374.5" dy="0">WinRM listener/auth</tspan></text><line x1="480" y1="140" x2="508" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a9)"/><rect x="516" y="84" width="205" height="112" rx="12" fill="#1a3851" stroke="#f5c86b" stroke-width="2"/><text x="618.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="618.5" dy="0">WMI/OMI or Windows</tspan><tspan x="618.5" dy="21">Agent</tspan></text><line x1="724" y1="140" x2="752" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a9)"/><rect x="760" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="862.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="862.5" dy="0">Normalized</tspan><tspan x="862.5" dy="21">events/metrics</tspan></text><rect x="92" y="242" width="816" height="78" rx="12" fill="#2b2222" stroke="#ff9b85" stroke-width="2"/><text x="112" y="270" fill="#ffb6a6" font-family="Arial" font-size="14" font-weight="700">FAILURE / EVIDENCE BOUNDARY</text><text x="112" y="295" fill="#fff0ec" font-family="Arial" font-size="15">Ping proves reachability, not WMI authorization or log subscription</text><text x="28" y="350" fill="#9fb5cc" font-family="Arial" font-size="12">Lesson 10 · agentless WMI/OMI WinRM monitoring distinct from Windows Agent template collection</text></svg>