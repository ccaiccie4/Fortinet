<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img"><title>FortiGate — Local-in policy boundaries and per-policy logging</title><desc>Four-stage mechanism flow and failure boundary.</desc><defs><marker id="a0" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8cc8ff"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b1726"/><text x="28" y="34" fill="#f5c86b" font-family="Arial" font-size="18" font-weight="700">FortiGate · mechanism map</text><rect x="28" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="130.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="130.5" dy="0">Inbound packet for</tspan><tspan x="130.5" dy="21">FortiGate IP</tspan></text><line x1="236" y1="140" x2="264" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a0)"/><rect x="272" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="374.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="374.5" dy="0">Interface/service</tspan><tspan x="374.5" dy="21">eligibility</tspan></text><line x1="480" y1="140" x2="508" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a0)"/><rect x="516" y="84" width="205" height="112" rx="12" fill="#1a3851" stroke="#f5c86b" stroke-width="2"/><text x="618.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor="middle" font-weight="600"><tspan x="618.5" dy="0">IPv4/IPv6 local-in</tspan><tspan x="618.5" dy="21">rule match</tspan></text><line x1="724" y1="140" x2="752" y2="140" stroke="#8cc8ff" stroke-width="3" marker-end="url(#a0)"/><rect x="760" y="84" width="205" height="112" rx="12" fill="#13263a" stroke="#4c7595" stroke-width="2"/><text x="862.5" y="116" fill="#eef6ff" font-family="Arial" font-size="15" text-anchor=