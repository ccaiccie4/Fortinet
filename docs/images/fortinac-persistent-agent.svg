<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330"><defs><linearGradient id="g"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#40566c"/></marker></defs><rect width="1180" height="330" fill="#f8fafc"/><rect width="1180" height="44" fill="url(#g)"/><text x="22" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="white">FortiNAC Persistent Agent — Identity, TLS Control Channel, Compliance, and Enforcement</text><rect y="44" width="300" height="236" fill="#e8f3ff"/><rect x="300" y="44" width="250" height="236" fill="#fff0e8"/><rect x="550" y="44" width="330" height="236" fill="#fff9dc"/><rect x="880" y="44" width="300" height="236" fill="#e9f8ef"/><g font-family="system-ui" font-size="13" font-weight="700"><text x="12" y="65">Endpoint</text><text x="312" y="65">Agent Channel</text><text x="562" y="65">FortiNAC state</text><text x="892" y="65">Access enforcement</text></g><g stroke="#40566c" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M190 145H255"/><path d="M420 145H585"/><path d="M750 145C790 145 790 95 830 95"/><path d="M750 145C790 145 790 215 830 215"/><path d="M995 95C1030 95 1030 155 1065 155"/><path d="M995 215C1030 215 1030 155 1065 155"/></g><g stroke="#315a7d" stroke-width="1.7"><rect x="40" y="112" width="150" height="66" rx="12" fill="#cfe5ff"/><rect x="255" y="108" width="165" height="74" rx="12" fill="#ffd4bb"/><rect x="585" y="108" width="165" height="74" rx="12" fill="#fff09a"/><rect x="830" y="65" width="165" height="60" rx="12" fill="#ffe070"/><rect x="830" y="185" width="165" height="60" rx="12" fill="#ffcf68"/><rect x="1065" y="118" width="100" height="74" rx="12" fill="#c9edd4"/></g><g font-family="system-ui" font-size="13" text-anchor="middle" fill="#17324d"><text x="115" y="140" font-weight="700">Endpoint</text><text x="115" y="159">Persistent Agent</tex