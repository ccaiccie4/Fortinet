<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330"><defs><linearGradient id="g"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#dc2626"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#40566c"/></marker></defs><rect width="1180" height="330" fill="#f8fafc"/><rect width="1180" height="44" fill="url(#g)"/><text x="22" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="white">FortiPAM Secret Access — Checkout, Approval Tiers, Launch, Recording, and Revocation</text><rect y="44" width="240" height="236" fill="#e8f3ff"/><rect x="240" y="44" width="300" height="236" fill="#fff0e8"/><rect x="540" y="44" width="300" height="236" fill="#fff9dc"/><rect x="840" y="44" width="340" height="236" fill="#e9f8ef"/><g font-family="system-ui" font-size="13" font-weight="700"><text x="12" y="65">Requester</text><text x="252" y="65">Secret governance</text><text x="552" y="65">Approval plane</text><text x="852" y="65">Privileged session</text></g><g stroke="#40566c" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M175 145H275"/><path d="M440 105C485 105 485 95 530 95"/><path d="M440 205C485 205 485 205 530 205"/><path d="M690 95V175"/><path d="M690 205C755 205 755 105 820 105"/><path d="M975 105V205"/></g><g stroke="#315a7d" stroke-width="1.7"><rect x="35" y="115" width="140" height="60" rx="12" fill="#cfe5ff"/><rect x="275" y="70" width="165" height="70" rx="12" fill="#ffd4bb"/><rect x="275" y="175" width="165" height="60" rx="12" fill="#ffc6a3"/><rect x="530" y="65" width="160" height="60" rx="12" fill="#fff0a0"/><rect x="530" y="175" width="160" height="60" rx="12" fill="#ffe070"/><rect x="820" y="70" width="155" height="70" rx="12" fill="#cfead6"/><rect x="820" y="175" width="155" height="60" rx="12" fill="#bfe5c9"/></g><g font-family="system-ui" font-size="13" text-anchor="middle" fill="#17324d"><text x="105" y="145" font-weight="700">Privileged user</text><text x="357" y="98" font-weight="700">Checkout lease</text><text x="357" y="117">owner + duration</text><text x="357" y="202" font-weight="700">Launch request</text><text x="610" y="92" font-weight="700">Approval tier 1</text><text x="610" y="202" font-weight="700">Approval tier 2</text><text x="897" y="98" font-weight="700">Proxy launch</text><text x="897" y="117">session recording</text><text x="897" y="202" font-weight="700">Revoke / force checkout</text></g><rect y="280" width="1180" height="50" fill="#edf2f7"/><g font-family="system-ui" font-size="11.5"><text x="20" y="309">● Checkout defines current ownership</text><text x="350" y="309">● Approval defines authorization and can have multiple tiers</text><text x="790" y="309">● Launch/record/revoke are later session states</text></g></svg>