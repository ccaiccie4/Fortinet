<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#334155"/></marker></defs><rect width="1400" height="720" fill="#f8fafc"/><rect width="1400" height="76" fill="#0f172a"/><text x="40" y="48" fill="white" font-family="Arial" font-size="28" font-weight="700">FortiAnalyzer — Log forwarding pipeline</text><g font-family="Arial" font-size="16" font-weight="700" fill="white"><rect x="60" y="180" width="220" height="95" rx="16" fill="#f59e0b"/><text x="80" y="215">1 FortiGate logs</text><text x="80" y="242" font-size="14">receive</text><rect x="60" y="380" width="220" height="95" rx="16" fill="#ef4444"/><text x="80" y="415">2 fortilogd</text><text x="80" y="442" font-size="14">store / index</text><rect x="390" y="180" width="220" height="95" rx="16" fill="#22c55e"/><text x="410" y="215">3 Filter engine</text><text x="410" y="242" font-size="14">All / Any logic</text><rect x="390" y="380" width="220" height="95" rx="16" fill="#ec4899"/><text x="410" y="415">4 Buffer</text><text x="410" y="442" font-size="14">disk reserve</text><rect x="720" y="180" width="220" height="95" rx="16" fill="#6366f1"/><text x="740" y="215">5 logfwd</text><text x="740" y="242" font-size="14">forward worker</text><rect x="720" y="380" width="220" height="95" rx="16" fill="#0ea5e9"/><text x="740" y="415">6 Transport</text><text x="740" y="442" font-size="14">TCP / UDP / TLS</text><rect x="1050" y="180" width="220" height="95" rx="16" fill="#8b5cf6"/><text x="1070" y="215">7 SIEM / FAZ</text><text x="1070" y="242" font-size="14">receiver / parser</text><rect x="1050" y="380" width="220" height="95" rx="16" fill="#14b8a6"/><text x="1070" y="415">8 Observe</text><text x="1070" y="442" font-size="14">rates / debug / sniffer</text></g><g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"><path d="M170 275V380"/><path d="M280 428H360V228H390"/><path d="M500 275V380"/><path d="M610 428H690V228H720"/><path d="M830 275V380"/><path d="M940 428H1020V228H1050"/><path d="M1160 275V380"/></g><rect x="45" y="555" width="1310" height="110" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="70" y="588" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">Troubleshooting boundary</text><text x="70" y="620" font-family="Arial" font-size="15" fill="#334155">Receiving, matching, buffering, transporting, and parsing are independent stages.</text><text x="70" y="647" font-family="Arial" font-size="15" fill="#334155">Prove the first missing stage before changing the next one.</text></svg>