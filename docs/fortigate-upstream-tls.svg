<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="FortiGate upstream TLS proxy path"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">FortiGate upstream TLS proxy path</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="16" fill="#475569">Client HTTP is terminated at the VIP; a separate TLS session protects the backend leg.</text><path d="M297 293 C309 275,309 275,313 293" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arr)"/><text x="309" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">TCP/80</text><path d="M491 293 C503 275,503 275,507 293" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arr)"/><text x="503" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">HTTP</text><path d="M685 293 C697 275,697 275,701 293" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arr)"/><text x="697" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">new session</text><path d="M879 293 C891 275,891 275,895 293" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arr)"/><text x="891" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">encrypted</text><rect x="127" y="245" width="170" height="96" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="212" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Client</text><text x="212" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#334155">HTTP request</text><rect x="321" y="245" width="170" height